async function genererMessageMarketing(){
  const type=document.getElementById('mk-type')?.value||'promo';
  const typeLabel=MARKETING_TYPES.find(t=>t.id===type)?.label||type;
  const preview=document.getElementById('mk-preview');
  if(!preview)return;

  // Vérifier clé API
  const apiKey=state.settings.apiKey||'';
  if(!apiKey){
    preview.innerHTML=`<div style="background:#FEE2E2;border-radius:9px;padding:14px;color:var(--red);font-size:13px">
      <strong>🔑 Clé API manquante</strong><br>
      Ajoutez votre clé API Anthropic dans <strong>⚙️ Coordonnées bancaires → Clé API</strong> pour utiliser l'IA.<br><br>
      <a href="https://console.anthropic.com" target="_blank" style="color:var(--blue)">→ Obtenir une clé sur console.anthropic.com</a>
    </div>`;
    return;
  }

  preview.innerHTML='<div style="display:flex;align-items:center;gap:8px;color:var(--gray)"><div class="pulse"></div><div class="pulse"></div><div class="pulse"></div> Génération en cours...</div>';
  const s=state.settings;
  const prompt=`Tu es un expert en marketing pour une entreprise de nettoyage haute pression en Suisse romande.
Génère un message WhatsApp professionnel et sympathique pour une campagne de type: ${typeLabel}.
Entreprise: Bowen HydroClean, Nettoyage extérieur, basée à ${s.npa||'Domdidier'}.
Le message doit:
- Commencer par "Bonjour [Prénom],"
- Être en français, ton chaleureux et professionnel
- Inclure une accroche claire et une offre ou message concret
- Mentionner Bowen HydroClean
- Se terminer par une invitation à répondre ou appeler
- Faire 5-7 lignes maximum
- Utiliser quelques emojis pertinents
Génère uniquement le message, sans explication.`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    if(data.error){throw new Error(data.error.message);}
    const msg=data.content?.[0]?.text||'Erreur de génération';
    preview.style.cssText='background:var(--bg);border-radius:10px;padding:16px;font-size:13px;line-height:1.75;white-space:pre-line;color:var(--text)';
    preview.textContent=msg;
    if(document.getElementById('mk-message'))document.getElementById('mk-message').value=msg;
  }catch(e){
    preview.innerHTML=`<div style="color:var(--red);font-size:13px;padding:10px">❌ Erreur : ${e.message}</div>`;
  }
}

function creerCampagne(){
  const titre=document.getElementById('mk-titre')?.value.trim();
  if(!titre)return alert('Veuillez saisir un titre de campagne.');
  const clientsChecked=[...document.querySelectorAll('.mk-client-cb:checked')].map(cb=>parseInt(cb.value));
  if(!clientsChecked.length)return alert('Veuillez sélectionner au moins un client.');
  const canal=document.getElementById('mk-canal')?.value||'whatsapp';
  const message=document.getElementById('mk-message')?.value.trim();
  if(!message)return alert('Veuillez générer ou saisir un message.');
  const destinataires=clientsChecked.map(cid=>{
    const c=state.clients.find(x=>x.id===cid);
    return{clientId:cid,nom:c?.nom||'',contact:canal==='email'?c?.email:c?.tel,canal,repondu:false,dateEnvoi:null};
  });
  const camp={
    id:state.nextCampagneId++,
    titre,
    type:document.getElementById('mk-type')?.value||'promo',
    message,canal,
    delaiRelance:parseInt(document.getElementById('mk-relance')?.value)||7,
    destinataires,
    statut:'brouillon',
    dateCrea:new Date().toISOString().split('T')[0],
    dateEnvoi:null,
  };
  state.campagnes.push(camp);
  saveStorage('campagnes');
  state.marketingTab='campagnes';
  render();
  showToast('✅ Campagne créée ! Lancez-la quand vous êtes prêt.');
}

function lancerCampagne(id){
  const c=state.campagnes.find(x=>x.id===id);
  if(!c)return;
  c.statut='envoyée';
  c.dateEnvoi=new Date().toISOString().split('T')[0];
  // Envoyer à chaque destinataire
  let i=0;
  c.destinataires.forEach(d=>{
    const client=state.clients.find(x=>x.id===d.clientId)||{};
    const msg=c.message.replace('[Prénom]',d.nom.split(' ')[0]);
    if(d.canal==='whatsapp'||d.canal==='les deux'){
      let num=(d.contact||client.tel||'').replace(/\s/g,'').replace(/[^0-9+]/g,'');
      if(num.startsWith('0'))num='41'+num.slice(1);
      if(num.startsWith('+'))num=num.slice(1);
      if(num)setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank'),i++*700);
    }
    if(d.canal==='email'||d.canal==='les deux'){
      const email=d.contact||client.email||'';
      if(email)setTimeout(()=>{window.location.href='mailto:'+email+'?subject='+encodeURIComponent(c.titre)+'&body='+encodeURIComponent(msg);},i++*800);
    }
    d.dateEnvoi=new Date().toISOString().split('T')[0];
  });
  saveStorage('campagnes');
  render();
  showToast('🚀 Campagne lancée — '+c.destinataires.length+' messages envoyés !');
}

function marquerRepondu(campId,clientId){
  const c=state.campagnes.find(x=>x.id===campId);
  if(!c)return;
  const d=c.destinataires.find(x=>String(x.clientId)===String(clientId));
  if(d){d.repondu=true;d.dateReponse=new Date().toISOString().split('T')[0];}
  const tousRepondus=c.destinataires.every(x=>x.repondu);
  if(tousRepondus)c.statut='terminée';
  saveStorage('campagnes');render();
}

function relancerClient(campId,clientId){
  const c=state.campagnes.find(x=>x.id===campId);
  if(!c)return;
  const d=c.destinataires.find(x=>String(x.clientId)===String(clientId));
  if(!d)return;
  const client=state.clients.find(x=>x.id===parseInt(clientId))||{};
  const msg='🔔 Rappel — '+c.message.replace('[Prénom]',d.nom.split(' ')[0]);
  let num=(d.contact||client.tel||'').replace(/\s/g,'').replace(/[^0-9+]/g,'');
  if(num.startsWith('0'))num='41'+num.slice(1);
  if(num.startsWith('+'))num=num.slice(1);
  if(num)window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
}

function relancerCampagne(id){
  const c=state.campagnes.find(x=>x.id===id);
  if(!c)return;
  const jours=Math.floor((new Date()-new Date(c.dateEnvoi))/864e5);
  const aRelancer=c.destinataires.filter(d=>!d.repondu&&jours>=(c.delaiRelance||7));
  if(!aRelancer.length){showToast('Tous les clients ont déjà répondu !');return;}
  let i=0;
  aRelancer.forEach(d=>{

    const msg='🔔 Rappel — '+c.message.replace('[Prénom]',d.nom.split(' ')[0]);
    let num=(d.contact||client.tel||'').replace(/\s/g,'').replace(/[^0-9+]/g,'');
    if(num.startsWith('0'))num='41'+num.slice(1);
    if(num.startsWith('+'))num=num.slice(1);
    if(num)setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank'),i++*700);

                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.533 5.858L0 24l6.335-1.508A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.657-.502-5.184-1.379l-.371-.22-3.862.921.977-3.773-.242-.389A9.944 9.944 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
                WA
              </button>`:''} 
              ${e.email?`<button class="btn btn-primary btn-sm" onclick="envoyerRappelEmail(${c.id},${e.id})">📧</button>`:
                `<span style="font-size:10px;color:var(--gray2)">Pas de contact</span>`}
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  });

  document.getElementById('modalContent').innerHTML=`
    <div class="modal-header">
      <div>
        <div class="modal-title" style="color:var(--orange)">⏰ Rappels du lendemain</div>
        <div style="font-size:12px;color:var(--gray);margin-top:2px">${tomLabel} \u2014 ${chantiers.length} chantier${chantiers.length>1?'s':''}</div>
      </div>
      <button class="btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div style="background:var(--orange2);border-radius:9px;padding:10px 13px;font-size:12px;color:#92400E;margin-bottom:14px">
      ⏰ Rappels automatiques \u2014 Envoyez un message \u00e0 chaque employ\u00e9 pour confirmer leur pr\u00e9sence demain.
    </div>
    ${rows}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;flex-wrap:wrap;gap:8px">
      <button class="btn btn-sm" style="background:#25D366;color:white;font-weight:700" onclick="envoyerTousRappels()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.533 5.858L0 24l6.335-1.508A11.955 11.955 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.657-.502-5.184-1.379l-.371-.22-3.862.921.977-3.773-.242-.389A9.944 9.944 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
        Envoyer WA \u00e0 tous
      </button>
      <button class="btn btn-secondary" onclick="closeModal()">Fermer</button>
    </div>`;
  openModal();
  if(auto)markReminderSent();
}

function envoyerTousRappels(){
  const chantiers=getChantiersTomorrow();
  let i=0;
  chantiers.forEach(c=>{
    (c.employes||[]).forEach(eid=>{
      const e=state.employes.find(x=>x.id===eid);
      if(e&&e.tel)setTimeout(()=>envoyerRappelWA(c.id,e.id),i++*700);
    });
  });
}

// ── Vérification automatique toutes les minutes ──────────────────────────────
function checkRemindersDue(){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes();
  // Trigger at 7:00 AM (h=7, m=0 or 1 to allow 1 min margin)
  if(h===7&&m<=1&&!reminderAlreadySentToday()){
    const chantiers=getChantiersTomorrow();
    if(chantiers.length>0){
      // Browser notification
      if(Notification.permission==='granted'){
        new Notification('Bowen HydroClean \u2014 Rappels chantiers',{
          body:chantiers.length+' chantier'+( chantiers.length>1?'s':'')+' planifi\u00e9'+( chantiers.length>1?'s':'')+' demain. Envoyez les rappels aux employ\u00e9s.',
          icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%230EA5E9"/></svg>'
        });
      }
      openReminderModal(true);
    }
  }
}

// Demander permission notifications navigateur
function requestNotifPermission(){
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}

// ── PWA INSTALL ──────────────────────────────────────────────────────────────
let _pwaPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) { btn.style.display = 'inline-flex'; }
});

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
  _pwaPrompt = null;
});

function installPWA() {
  if (_pwaPrompt) {
    _pwaPrompt.prompt();
    _pwaPrompt.userChoice.then(r => {
      if (r.outcome === 'accepted') {
        document.getElementById('install-btn').style.display = 'none';
      }
      _pwaPrompt = null;
    });
  } else {
    alert('Pour installer : ouvrez l\'app via le lanceur BHC, puis cliquez sur ce bouton dans Chrome.');
  }
}

// Service worker registration - only on localhost
if ('serviceWorker' in navigator && location.hostname === 'localhost') {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log('SW enregistré'))
    .catch(e => console.log('SW non disponible:', e.message));
}

// INIT
function init(){
  // Logo
  const logoEl = document.getElementById('topbarLogo');
  if(logoEl) logoEl.src = LOGO_TOPBAR;
  // Dark mode
  const theme=localStorage.getItem('bhc-theme')||'light';
  document.documentElement.setAttribute('data-theme',theme);
  updateDarkIcon();
  document.getElementById('topDate').textContent=new Date().toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'long'});
  loadStorage();render();updateNotifBadge();
  requestNotifPermission();
  // Lancer la vérification automatique toutes les minutes
  setInterval(checkRemindersDue,60000);
  // Vérifier au démarrage si on est déjà à 7h et que les rappels n'ont pas été envoyés
  checkRemindersDue();
  // Alerte si chantiers demain (au démarrage)
  setTimeout(()=>{
    const tom=getChantiersTomorrow();
    if(tom.length>0&&!reminderAlreadySentToday()){
      const alerte=document.createElement('div');
      alerte.id='reminder-banner';
      alerte.style.cssText='position:fixed;bottom:20px;right:20px;background:var(--orange);color:white;border-radius:12px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:500;display:flex;align-items:center;gap:12px;max-width:320px;cursor:pointer;animation:slideDown 0.3s ease';
      alerte.innerHTML=`<div style="font-size:22px">\u23F0</div><div><div style="font-weight:700;font-size:14px">${tom.length} chantier${tom.length>1?'s':''} demain</div><div style="font-size:12px;opacity:0.9">Cliquez pour envoyer les rappels aux employ\u00e9s</div></div><button onclick="document.getElementById('reminder-banner').remove()" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:14px">✕</button>`;
      alerte.onclick=(e)=>{if(e.target.tagName!=='BUTTON'){openReminderModal(false);alerte.remove();}};
      document.body.appendChild(alerte);
      setTimeout(()=>{if(document.getElementById('reminder-banner'))document.getElementById('reminder-banner').remove();},15000);
    }
  },1500);
}
init();

</script>
