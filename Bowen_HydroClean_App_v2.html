function renderRapport(){
  const now=new Date();
  const moisSel=state.rapportMois??now.getMonth();
  const annSel=state.rapportAnnee??now.getFullYear();
  const moisNom=new Date(annSel,moisSel,1).toLocaleDateString('fr-CH',{month:'long',year:'numeric'});

  // Data for selected month
  const chanMois=state.chantiers.filter(c=>{
    if(!c.date)return false;
    const d=new Date(c.date);
    return d.getMonth()===moisSel&&d.getFullYear()===annSel;
  });
  const termines=chanMois.filter(c=>c.statut==='Terminé');
  const revenu=termines.reduce((s,c)=>s+c.montant,0);
  const surf=termines.reduce((s,c)=>s+c.surface,0);
  const hMois=state.heures.filter(h=>{const d=new Date(h.date);return d.getMonth()===moisSel&&d.getFullYear()===annSel;});
  const totalH=hMois.reduce((s,h)=>s+h.heures,0);
  const facMois=state.factures.filter(f=>{const d=new Date(f.dateFacture);return d.getMonth()===moisSel&&d.getFullYear()===annSel;});
  const factureCA=facMois.reduce((s,f)=>s+f.ttc,0);

  // Employee breakdown
  const empStats=state.employes.filter(e=>e.actif).map(e=>{
    const h=hMois.filter(x=>x.employeId===e.id).reduce((s,x)=>s+x.heures,0);
    const s2=hMois.filter(x=>x.employeId===e.id).reduce((s,x)=>{const c=state.chantiers.find(c=>c.id===x.chantierId);return s+(c?c.surface:0);},0);
    return{nom:e.nom,heures:h,surface:s2,salaire:Math.round(h*e.tauxHoraire)};
  }).filter(e=>e.heures>0).sort((a,b)=>b.heures-a.heures);

  // Previous months nav
  const prevM=()=>{
    if(state.rapportMois===undefined){state.rapportMois=now.getMonth();state.rapportAnnee=now.getFullYear();}
    if(state.rapportMois===0){state.rapportMois=11;state.rapportAnnee--;}
    else state.rapportMois--;
    render();
  };
  const nextM=()=>{
    if(state.rapportMois===undefined){state.rapportMois=now.getMonth();state.rapportAnnee=now.getFullYear();}
    if(state.rapportMois===11){state.rapportMois=0;state.rapportAnnee++;}

  <div class="page-header">

    <div class="hdr-actions">
      <button class="btn btn-secondary btn-sm" onclick="(${prevM.toString()})()">‹ Mois préc.</button>
      <button class="btn btn-secondary btn-sm" onclick="(${nextM.toString()})()">Mois suiv. ›</button>
      <button class="btn btn-primary btn-sm" onclick="downloadRapportPDF()">⬇️ PDF du rapport</button>
    </div>
  </div>
  <div class="stat-grid" style="margin-bottom:20px">
    <div class="stat-card"><div class="stat-label">Revenus terminés</div><div class="stat-value" style="color:var(--green)">CHF ${revenu.toLocaleString('fr-CH')}</div><div class="stat-sub">${termines.length} chantier${termines.length!==1?'s':''} terminé${termines.length!==1?'s':''}</div><div class="stat-icon si-green"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div></div>
    <div class="stat-card"><div class="stat-label">Chantiers planifiés</div><div class="stat-value">${chanMois.length}</div><div class="stat-sub">${termines.length} terminés · ${chanMois.length-termines.length} en cours/planifiés</div><div class="stat-icon si-blue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div></div>
    <div class="stat-card"><div class="stat-label">Surface nettoyée</div><div class="stat-value">${surf} m²</div><div class="stat-sub">Chantiers terminés</div><div class="stat-icon si-navy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div></div>

          </div>`).join('')}
      </div>`}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="section-title">👷 Performance équipe</div>

let _swipeDragging=false;

function initSwipe(){
  // Nettoyer les anciens listeners globaux
  document.removeEventListener('mousemove',_swipeMouseMove);
  document.removeEventListener('mouseup',_swipeMouseUp);

  document.querySelectorAll('.swipe-card').forEach(card=>{
    if(card._swipeInit)return; // éviter double init
    card._swipeInit=true;
    const id=parseInt(card.dataset.id);
    const type=card.dataset.type||'chantier';
    const wrap=card.closest('.swipe-container');
    const bg=wrap?.querySelector('.swipe-bg,.swipe-bg-del');
    let startX=0,startY=0,dx=0,dragging=false;
    const threshold=90;

    function onStart(x,y){
      startX=x;startY=y;dx=0;dragging=true;_swipeDragging=true;
      card.style.transition='none';
    }
    function onMove(x,y){
      if(!dragging)return;
      dx=Math.min(0,x-startX);
      const absDy=Math.abs(y-startY);
      if(absDy>Math.abs(dx)*2){
        dragging=false;_swipeDragging=false;
        card.style.transform='';
        card.style.transition='transform 0.25s ease';
        if(bg)bg.style.opacity=0;
        return;
      }
      card.style.transform='translateX('+dx+'px)';
      if(bg)bg.style.opacity=Math.min(1,Math.abs(dx)/threshold);
    }
    function onEnd(){
      if(!dragging)return;
      dragging=false;_swipeDragging=false;
      card.style.transition='transform 0.25s ease';
      if(Math.abs(dx)>=threshold){
        card.style.transform='translateX(-110%)';
        if(bg)bg.style.opacity=1;
        setTimeout(()=>{
          const nom=type==='client'
            ?(state.clients.find(x=>x.id===id)?.nom||'ce client')
            :(state.chantiers.find(x=>x.id===id)?.client||'ce chantier');
          if(confirm('Supprimer '+nom+' ?')){
            if(type==='client'){
              state.clients=state.clients.filter(x=>x.id!==id);
              saveStorage('clients');
            } else {
              state.chantiers=state.chantiers.filter(x=>x.id!==id);
              saveStorage('chantiers');
            }
            render();
            showToast('🗑 Supprimé !');
          } else {
            card.style.transform='';
            if(bg)bg.style.opacity=0;
          }
        },200);
      } else {
        card.style.transform='';
        if(bg)bg.style.opacity=0;
      }
    }

    // Touch events
    card.addEventListener('touchstart',e=>{
      const t=e.touches[0];onStart(t.clientX,t.clientY);
    },{passive:true});
    card.addEventListener('touchmove',e=>{
      const t=e.touches[0];onMove(t.clientX,t.clientY);
    },{passive:true});
    card.addEventListener('touchend',onEnd);

    // Mouse events
    card.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      onStart(e.clientX,e.clientY);
      card.style.cursor='grabbing';
    });
    card._swipeOnMove=e=>{if(dragging)onMove(e.clientX,e.clientY);};
    card._swipeOnUp=e=>{if(dragging){onEnd();card.style.cursor='grab';}};
    document.addEventListener('mousemove',card._swipeOnMove);
    document.addEventListener('mouseup',card._swipeOnUp);
  });
}

function viderCache(){
  try{
    const keysToKeep=['bhc-clients','bhc-chantiers','bhc-monthly','bhc-employes',
      'bhc-heures','bhc-devislog','bhc-factures','bhc-settings','bhc-campagnes',
      'bhc-prospection','bhc-theme','bhc-reminder-sent'];
    const allKeys=[];
    for(let i=0;i<localStorage.length;i++)allKeys.push(localStorage.key(i));
    allKeys.filter(k=>!keysToKeep.includes(k)).forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  closeModal();
  showToast('Cache vide ! Rechargement...');
  setTimeout(()=>location.reload(),1000);
}

function resetComplet(){
  if(!confirm('ATTENTION : Toutes vos donnees seront supprimees. Continuer ?'))return;
  if(!confirm('Derniere confirmation - vraiment tout supprimer ?'))return;
  try{localStorage.clear();}catch(e){}

  setTimeout(()=>location.reload(),1000);
}

function safeMailto(email, subject, body){
  if(!email){showToast('Pas d\'email disponible');return;}
  try{
    const url='mailto:'+encodeURIComponent(email)
      +'?subject='+encodeURIComponent(subject||'')
      +'&body='+encodeURIComponent(body||'');
    window.location.href=url;
  }catch(e){
    // Safari fallback - open without body if too long
    try{
      window.open('mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject||''),'_blank');
    }catch(e2){
      showToast('Ouvrez votre application email manuellement');
    }
  }
}

function safeDownload(url, filename){
  try{
    const a=document.createElement('a');
    a.href=url;a.download=filename||'fichier';
    // Safari needs the element in the DOM
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a);},100);
  }catch(e){
    window.open(url,'_blank');
  }
}

function sendWhatsApp(tel,msg){
  let num=(tel||'').replace(/\s/g,'').replace(/[^\d+]/g,'');
  if(num.startsWith('0'))num='41'+num.slice(1);
  if(num.startsWith('+'))num=num.slice(1);
  if(!num){alert('Numero de telephone manquant');return;}
  window.open('https://wa.me/'+num+(msg?'?text='+encodeURIComponent(msg):''),'_blank');
}

async function prospRechercher(){
  const rayon=parseInt(document.getElementById('prosp-rayon')?.value||10);
  const filtre=state.prospection?.filtre||'restaurant';
  if(!state.prospection)state.prospection={contacts:[],filtre,rayon};
  state.prospection.rayon=rayon;

  const status=document.getElementById('prosp-status');
  if(status)status.textContent='Recherche en cours...';

  // Coordonnées Domdidier
  const lat=46.9028,lon=7.0192;

  // Mapping vers termes Nominatim
  const filtreMap={
    restaurant:'restaurant',hotel:'hotel',company:'entreprise',
    school:'ecole',place_of_worship:'eglise',sports_centre:'sport',
    supermarket:'supermarche',car_dealer:'garage'
  };
  const terme=filtreMap[filtre]||filtre;

  try{
    // Nominatim — API publique OSM, CORS compatible tous navigateurs
    const url=`https://nominatim.openstreetmap.org/search?`
      +`q=${encodeURIComponent(terme)}`
      +`&lat=${lat}&lon=${lon}`
      +`&bounded=1`
      +`&viewbox=${lon-rayon*0.015},${lat+rayon*0.012},${lon+rayon*0.015},${lat-rayon*0.012}`
      +`&format=json&limit=40&addressdetails=1&extratags=1`;

    const resp=await fetch(url,{
      headers:{'Accept':'application/json','Accept-Language':'fr'}
    });

    if(!resp.ok)throw new Error('Reponse serveur: '+resp.status);
    const data=await resp.json();

    const nouveaux=data.map(el=>{
      const ext=el.extratags||{};
      const addr=el.address||{};
      return{
        id:'nom_'+el.place_id,
        nom:el.display_name.split(',')[0]||'Etablissement',
        adresse:[addr.road,addr.house_number,addr.town||addr.village||addr.city].filter(Boolean).join(' ')||el.display_name.split(',').slice(1,3).join(',').trim(),
        tel:ext.phone||ext['contact:phone']||'',
        email:ext.email||ext['contact:email']||'',
        web:ext.website||ext['contact:website']||'',
        lat:parseFloat(el.lat),
        lon:parseFloat(el.lon),
        statut:'nouveau',note:'',
        type:filtre,dateContact:null
      };
    }).filter(c=>c.nom&&c.nom.length>1);

    // Vider et remplacer (pas accumuler)
    state.prospection.contacts=nouveaux;
    saveStorage('prospection');

    if(status)status.textContent=nouveaux.length+' trouvés';

    // Mettre à jour le panel résultats
    const liste=document.getElementById('prosp-liste');
    const count=document.getElementById('prosp-count');
    if(count)count.textContent='('+nouveaux.length+')';
    if(liste){
      if(nouveaux.length===0){
        liste.innerHTML=`<div style="text-align:center;padding:40px 16px;color:#94A3B8">
          <div style="font-size:32px;margin-bottom:8px">🔍</div>
          <div style="font-weight:600;font-size:13px">Aucun résultat</div>
          <div style="font-size:11px;margin-top:4px">Essayez un rayon plus grand</div>
        </div>`;
      } else {
        liste.innerHTML=nouveaux.map(c=>prospContactCard(c)).join('');
      }
    }

    // Initialiser/mettre à jour la carte
    setTimeout(()=>prospInitMap(lat,lon,nouveaux),100);

  }catch(e){
    console.error('Prospection error:',e);
    if(status)status.textContent='Pas de resultats pour cette zone — essayez un rayon plus grand';
  }
}

function prospInitMap(centerLat,centerLon,points){
  const mapEl=document.getElementById('prosp-map');
  if(!mapEl)return;

  // Vérifier si Leaflet est chargé
  if(typeof L==='undefined'){
    // Charger Leaflet dynamiquement
    if(!document.getElementById('leaflet-css')){
      const css=document.createElement('link');
      css.id='leaflet-css';css.rel='stylesheet';
      css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
      document.head.appendChild(css);
    }
    if(!document.getElementById('leaflet-js')){
      const js=document.createElement('script');
      js.id='leaflet-js';
      js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      js.onload=()=>prospInitMap(centerLat,centerLon,points);
      document.head.appendChild(js);
      return;
    }
    setTimeout(()=>prospInitMap(centerLat,centerLon,points),500);
    return;
  }

  // Détruire carte existante
  if(window._prospMap){window._prospMap.remove();window._prospMap=null;}

  const map=L.map('prosp-map').setView([centerLat,centerLon],13);
  window._prospMap=map;

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19
  }).addTo(map);

  // Marqueur Domdidier (centre)
  L.marker([centerLat,centerLon],{
    icon:L.divIcon({html:'<div style="background:var(--navy);color:white;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">🏠</div>',iconSize:[20,20],className:''})
  }).addTo(map).bindPopup('<b>Bowen HydroClean</b><br>Domdidier');

  // Marqueurs entreprises
  points.forEach(p=>{
    if(!p.lat||!p.lon)return;
    const marker=L.marker([p.lat,p.lon],{
      icon:L.divIcon({html:`<div style="background:#0EA5E9;color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid white">📍</div>`,iconSize:[28,28],className:''})
    }).addTo(map);
    marker.bindPopup(`
      <div style="min-width:180px;font-family:'DM Sans',sans-serif">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px">${p.nom}</div>
        <div style="font-size:11px;color:#64748B;margin-bottom:8px">${p.adresse}</div>
        ${p.tel?`<div style="font-size:11px;margin-bottom:4px">📞 ${p.tel}</div>`:''}
        <button onclick="prospEnvoyerEmail('${p.id}')" style="background:#0EA5E9;color:white;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;width:100%;margin-top:4px">✉ Envoyer offre</button>
      </div>`);
  });
}

async function prospEnvoyerEmail(id){
  const c=(state.prospection?.contacts||[]).find(x=>x.id===id);
  if(!c)return;
  const s=state.settings;
  const apiKey=s.apiKey||'';

  // Générer message IA si clé disponible
  let msg=`Bonjour,\n\nNous sommes Bowen HydroClean, spécialistes du nettoyage haute pression en Suisse romande.\n\nNous serions ravis de vous proposer nos services pour l'entretien de vos façades, terrasses et allées.\n\nDevis gratuit et sans engagement au ${s.waNumber||'079 663 88 16'} ou ${s.email||'info@bowenhydroclean.ch'}\n\nCordialement,\nBowen HydroClean — Domdidier`;

  if(apiKey){
    try{
      const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:250,messages:[{role:'user',content:`Email de prospection B2B concis pour ${c.nom} (${c.type}). Bowen HydroClean, nettoyage haute pression, Domdidier Suisse. Propose devis gratuit. Tel: ${s.waNumber||'079 663 88 16'}. Francais professionnel, sans emojis, max 5 lignes.`}]})});
      const data=await resp.json();
      if(!data.error)msg=data.content?.[0]?.text||msg;
    }catch(e){}
  }

  const email=c.email||'';
  const sujet=encodeURIComponent('Offre de service - Bowen HydroClean');
  const corps=encodeURIComponent(msg);

  if(email){
    try{window.location.href='mailto:'+(email||'')+'?subject='+sujet+'&body='+corps;}catch(_e){showToast('Ouvrez votre application email');}
  } else {
    // Afficher modal avec message à copier
    document.getElementById('modalContent').innerHTML=`
      <div class="modal-header">
        <div><div class="modal-title">✉ Email pour ${c.nom}</div><div style="font-size:12px;color:var(--gray)">Pas d'email trouvé — copiez le message</div></div>
        <button class="btn-ghost" onclick="closeModal()">✕</button>
      </div>
      <pre id="prosp-email-msg" style="background:var(--bg);padding:14px;border-radius:9px;font-size:12px;white-space:pre-wrap;line-height:1.7;max-height:300px;overflow-y:auto">${msg}</pre>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('prosp-email-msg').textContent).then(()=>showToast('Copié !'))">
          📋 Copier
        </button>
        <button class="btn btn-sm" style="background:var(--green);color:white;font-weight:700" onclick="window.location.href='mailto:?subject='+encodeURIComponent('Offre de service - Bowen HydroClean')+'&body='+encodeURIComponent(document.getElementById('prosp-email-msg').textContent)">
          📨 Envoyer
        </button>
        ${c.tel?`<button class="btn btn-sm" style="background:#25D366;color:white;font-weight:700" onclick="sendWhatsApp('${c.tel}',document.getElementById('prosp-email-msg').textContent)">💬 WA</button>`:''}
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Fermer</button>
      </div>`;
    openModal();
  }

  // Marquer comme contacté
  c.statut='contacte';c.dateContact=new Date().toISOString().split('T')[0];
  saveStorage('prospection');
}

function supprimerEmojis(t){return t.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE00}-\u{FEFF}]/gu,'').trim();}

function mkMagic(type){
  const titres={promo:'Offre speciale printemps',saison:'Nettoyage de printemps',relance:'On pense a vous',parrainage:'Parrainez un ami',urgence:'Offre flash 48h'};
  const t=document.getElementById('mk-titre');const s=document.getElementById('mk-type');
  if(t)t.value=titres[type]||'';if(s)s.value=type;
  showToast('Template applique — cliquez IA Generer !');
}

function mkToggle(id){
  if(!state.mkSelIds)state.mkSelIds=new Set();
  if(state.mkSelIds.has(id))state.mkSelIds.delete(id);else state.mkSelIds.add(id);
  // Update UI without full re-render
  const row=document.querySelector(`#mk-client-list [data-id="${id}"]`);
  if(row){
    const checked=state.mkSelIds.has(id);
    row.style.background=checked?'#EFF6FF':'white';
    const box=row.querySelector('div');
    if(box){box.style.borderColor=checked?'var(--blue)':'var(--border)';box.style.background=checked?'var(--blue)':'white';box.innerHTML=checked?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>':'';}
  }
  const count=document.getElementById('mk-count');
  if(count)count.textContent='('+state.mkSelIds.size+')';
}

function mkSelAll(checked){
  if(!state.mkSelIds)state.mkSelIds=new Set();
  const visible=[...document.querySelectorAll('#mk-client-list label')];
  visible.forEach(row=>{
    const m=row.getAttribute('onclick').match(/\d+/);if(!m)return;
    const id=parseInt(m[0]);
    if(checked)state.mkSelIds.add(id);else state.mkSelIds.delete(id);
    row.style.background=checked?'#EFF6FF':'white';
    const box=row.querySelector('div');
    if(box){box.style.borderColor=checked?'var(--blue)':'var(--border)';box.style.background=checked?'var(--blue)':'white';box.innerHTML=checked?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>':'';}
  });
  const count=document.getElementById('mk-count');
  if(count)count.textContent='('+state.mkSelIds.size+')';
}

function mkFiltrer(q){
  const s=q.toLowerCase();
  document.querySelectorAll('#mk-client-list label').forEach(r=>{r.style.display=(!s||r.textContent.toLowerCase().includes(s))?'flex':'none';});
}

async function genererMessageMarketing(){
  const el=document.getElementById('mk-message');if(!el)return;
  const apiKey=state.settings.apiKey||'';
  if(!apiKey){alert('Cle API manquante — Factures > Coordonnees bancaires');return;}
  const type=document.getElementById('mk-type')?.value||'promo';
  const labels={promo:'offre promotionnelle',saison:'offre saisonniere',relance:'relance client inactif',parrainage:'parrainage',urgence:'offre flash urgence'};
  el.value='Generation en cours...';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:250,messages:[{role:'user',content:`Message WhatsApp pour ${labels[type]} Bowen HydroClean, nettoyage haute pression, ${state.settings.npa||'Domdidier'}, Suisse. Commence par "Bonjour [Prenom],". Max 4 lignes. Texte brut, aucun emoji.`}]})
    });
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    el.value=supprimerEmojis(d.content?.[0]?.text||'');showToast('Message genere !');
  }catch(e){el.value='';alert('Erreur : '+e.message);}
}

function creerCampagne(){
  const titre=document.getElementById('mk-titre')?.value.trim();
  const message=document.getElementById('mk-message')?.value.trim();
  if(!titre)return alert('Titre manquant.');
  if(!message)return alert('Message manquant.');
  const ids=state.mkSelIds||new Set();
  if(!ids.size)return alert('Selectionnez au moins un client.');
  const canal=document.getElementById('mk-canal')?.value||'whatsapp';
  const dest=[...ids].map(cid=>{const c=state.clients.find(x=>x.id===cid);return{clientId:cid,nom:c?.nom||'',tel:c?.tel||'',email:c?.email||'',canal,repondu:false};});
  state.campagnes.push({
    id:state.nextCampagneId++,titre,message,canal,
    type:document.getElementById('mk-type')?.value||'promo',
    delaiRelance:parseInt(document.getElementById('mk-relance')?.value)||7,
    destinataires:dest,statut:'brouillon',
    dateCrea:new Date().toISOString().split('T')[0],dateEnvoi:null
  });
  saveStorage('campagnes');
  state.mkSelIds=new Set();
  document.getElementById('mk-titre').value='';
  document.getElementById('mk-message').value='';
  showToast('Campagne creee !');render();
}

function lancerCampagne(id){
  const c=state.campagnes.find(x=>x.id===id);if(!c)return;
  c.statut='envoyee';c.dateEnvoi=new Date().toISOString().split('T')[0];
  let i=0;
  c.destinataires.forEach(d=>{
    const prenom=d.nom.split(' ')[0];
    const msg=c.message.replace(/\[Pr[eé]nom\]/gi,prenom);
    if(c.canal!=='email'){
      let num=d.tel.replace(/\s/g,'').replace(/[^\d+]/g,'');
      if(num.startsWith('0'))num='41'+num.slice(1);if(num.startsWith('+'))num=num.slice(1);
      if(num)setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(supprimerEmojis(msg)),'_blank'),i++*700);
    }
    if(c.canal!=='whatsapp'&&d.email){
      try{setTimeout(()=>{window.location.href='mailto:'+d.email+'?subject='+encodeURIComponent(c.titre)+'&body='+encodeURIComponent(supprimerEmojis(msg));},i++*800);}catch(_e){showToast('Ouvrez votre application email');}
    }
    d.dateEnvoi=new Date().toISOString().split('T')[0];
  });
  saveStorage('campagnes');render();showToast('Campagne lancee !');
}

function voirSuiviCampagne(id){
  const c=state.campagnes.find(x=>x.id===id);if(!c)return;
  const j=c.dateEnvoi?Math.floor((new Date()-new Date(c.dateEnvoi))/864e5):0;
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-header">
      <div><div class="modal-title">${c.titre}</div><div style="font-size:12px;color:var(--gray)">Envoyee il y a ${j} jour${j!==1?'s':''}</div></div>
      <button class="btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:7px;max-height:55vh;overflow-y:auto">
      ${(c.destinataires||[]).map(d=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--bg);border-left:3px solid ${d.repondu?'var(--green)':'var(--border)'}">
          <div><div style="font-weight:600;font-size:13px">${d.nom}</div><div style="font-size:11px;color:var(--gray)">${d.tel||d.email||'—'}</div></div>
          <div style="display:flex;gap:6px">
            ${d.repondu
              ?`<span style="background:#D1FAE5;color:var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px">Repondu</span>`
              :`<button class="btn btn-secondary btn-sm" onclick="marquerRepondu(${c.id},${d.clientId});closeModal();voirSuiviCampagne(${c.id})">Repondu</button>
                <button class="btn btn-sm" style="background:#25D366;color:white;font-weight:700" onclick="relancerClient(${c.id},${d.clientId})">WA</button>`}
          </div>
        </div>`).join('')}
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm" style="background:#25D366;color:white;font-weight:700" onclick="relancerCampagne(${c.id})">Relancer tous</button>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">Fermer</button>
    </div>`;
  openModal();
}

function marquerRepondu(campId,clientId){
  const c=state.campagnes.find(x=>x.id===campId);if(!c)return;
  const d=c.destinataires.find(x=>x.clientId===clientId);
  if(d){d.repondu=true;d.dateReponse=new Date().toISOString().split('T')[0];}
  if(c.destinataires.every(x=>x.repondu))c.statut='terminee';
  saveStorage('campagnes');render();
}

function relancerClient(campId,clientId){
  const c=state.campagnes.find(x=>x.id===campId);if(!c)return;
  const d=c.destinataires.find(x=>x.clientId===clientId);if(!d)return;
  const msg=c.message.replace(/\[Pr[eé]nom\]/gi,d.nom.split(' ')[0]);
  let num=d.tel.replace(/\s/g,'').replace(/[^\d+]/g,'');
  if(num.startsWith('0'))num='41'+num.slice(1);if(num.startsWith('+'))num=num.slice(1);
  if(num)window.open('https://wa.me/'+num+'?text='+encodeURIComponent(supprimerEmojis(msg)),'_blank');
}

function relancerCampagne(id){
  const c=state.campagnes.find(x=>x.id===id);if(!c)return;
  const j=Math.floor((new Date()-new Date(c.dateEnvoi))/864e5);
  const liste=c.destinataires.filter(d=>!d.repondu&&j>=(c.delaiRelance||7));
  if(!liste.length){showToast('Tous ont deja repondu !');return;}
  liste.forEach((d,i)=>{
    const msg=c.message.replace(/\[Pr[eé]nom\]/gi,d.nom.split(' ')[0]);
    let num=d.tel.replace(/\s/g,'').replace(/[^\d+]/g,'');
    if(num.startsWith('0'))num='41'+num.slice(1);if(num.startsWith('+'))num=num.slice(1);
    if(num)setTimeout(()=>window.open('https://wa.me/'+num+'?text='+encodeURIComponent(supprimerEmojis(msg)),'_blank'),i*700);
  });
  showToast('Relance envoyee a '+liste.length+' client'+(liste.length>1?'s':'')+'!');
}

function supprimerCampagne(id){
  if(!confirm('Supprimer cette campagne ?'))return;
  state.campagnes=state.campagnes.filter(x=>x.id!==id);
  saveStorage('campagnes');render();
}

function voirDetailsCampagne(id){voirSuiviCampagne(id);}

// ── FLYER HELPERS ─────────────────────────────────────────────────────────────
function flyerToggle(id){
  if(!state.flyerSelIds)state.flyerSelIds=new Set();
  if(state.flyerSelIds.has(id))state.flyerSelIds.delete(id);else state.flyerSelIds.add(id);
  const row=document.querySelector(`#flyer-client-list [data-id="${id}"]`);

    const checked=state.flyerSelIds.has(id);row.style.background=checked?'#EFF6FF':'white';

  }
}

function flyerSelAll(checked){
  if(!state.flyerSelIds)state.flyerSelIds=new Set();
  state.clients.forEach(c=>{if(checked)state.flyerSelIds.add(c.id);else state.flyerSelIds.delete(c.id);});

}

function filtrerClientsFlyer(q){
  const s=q.toLowerCase();
  document.querySelectorAll('#flyer-client-list label').forEach(r=>{r.style.display=(!s||r.textContent.toLowerCase().includes(s))?'flex':'none';});
}

function getFlyerClients(){
  const ids=state.flyerSelIds||new Set();
  return ids.size?state.clients.filter(c=>ids.has(c.id)):state.clients;
}

async function genererMessageFlyer(){
  const el=document.getElementById('flyer-msg');if(!el)return;
  const apiKey=state.settings.apiKey||'';
  if(!apiKey){alert('Cle API manquante');return;}
  const type=document.getElementById('flyer-type-ia')?.value||'promo';
  el.value='Generation en cours...';
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:250,messages:[{role:'user',content:`Message WhatsApp pour flyer ${type} Bowen HydroClean, nettoyage haute pression, ${state.settings.npa||'Domdidier'}. Commence par "Bonjour [Prenom],". Max 4 lignes. Texte brut, aucun emoji.`}]})

function loadFlyerImage(input){
  const file=input.files[0];if(!file)return;
  if(file.size>10*1024*1024){alert('Max 10MB');return;}
  const reader=new FileReader();
  reader.onload=e=>{state.flyerImage=e.target.result;render();showToast('Flyer charge !');};
  reader.readAsDataURL(file);
}

function envoyerFlyerWA(){
  const clients=getFlyerClients();
  const msg=document.getElementById('flyer-msg')?.value||'Bonjour [Prenom] !';
  if(!clients.length){showToast('Selectionnez au moins un client !');return;}

    safeDownload(state.flyerImage,'Flyer-BHC.jpg');

  }
  clients.forEach((c,i)=>{
    let num=(c.tel||'').replace(/\s/g,'').replace(/[^\d+]/g,'');

function envoyerFlyerEmail(){
  const clients=getFlyerClients();
  const msg=document.getElementById('flyer-msg')?.value||'';
  if(!clients.length){showToast('Selectionnez au moins un client !');return;}

function envoyerRappelWA(chantierId,employeId){
  const c=state.chantiers.find(x=>x.id===chantierId);
  const e=state.employes.find(x=>x.id===employeId);
  let num=(e.tel||'').replace(/\s/g,'').replace(/[^0-9+]/g,'');
  if(num.startsWith('0'))num='41'+num.slice(1);
  if(num.startsWith('+'))num=num.slice(1);
  if(!num){alert('Num\u00e9ro manquant pour '+e.nom);return;}
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(buildRappelMsg(c,e)),'_blank');
}

function envoyerRappelEmail(chantierId,employeId){
  const c=state.chantiers.find(x=>x.id===chantierId);
  const e=state.employes.find(x=>x.id===employeId);
  if(!e.email){alert('Email manquant pour '+e.nom);return;}
  const{sujet,corps}=buildRappelEmail(c,e);
  try{window.location.href='mailto:'+e.email+'?subject='+encodeURIComponent(sujet)+'&body='+encodeURIComponent(corps);}catch(_e){showToast('Ouvrez votre application email');}
}

function envoyerTousRappels(){
  const chantiers=getChantiersTomorrow();
  let i=0;
  chantiers.forEach(c=>{
    (c.employes||[]).forEach(eid=>{
      const e=state.employes.find(x=>x.id===eid);
      if(e&&e.tel)setTimeout(()=>envoyerRappelWA(c.id,e.id),i++*700);
    });
  });
}

// ── Vérification automatique toutes les minutes ──────────────────────────────
function checkRemindersDue(){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes();
  // Trigger at 7:00 AM (h=7, m=0 or 1 to allow 1 min margin)
  if(h===7&&m<=1&&!reminderAlreadySentToday()){
    const chantiers=getChantiersTomorrow();
    if(chantiers.length>0){
      // Browser notification
      if(Notification.permission==='granted'){
        new Notification('Bowen HydroClean \u2014 Rappels chantiers',{
          body:chantiers.length+' chantier'+( chantiers.length>1?'s':'')+' planifi\u00e9'+( chantiers.length>1?'s':'')+' demain. Envoyez les rappels aux employ\u00e9s.',
          icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="%230EA5E9"/></svg>'
        });
      }
      openReminderModal(true);
    }
  }
}

// Demander permission notifications navigateur
function requestNotifPermission(){
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }
}

// ── PWA INSTALL ──────────────────────────────────────────────────────────────
let _pwaPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) { btn.style.display = 'inline-flex'; }
});

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
  _pwaPrompt = null;
});

function installPWA() {
  if (_pwaPrompt) {
    _pwaPrompt.prompt();
    _pwaPrompt.userChoice.then(r => {
      if (r.outcome === 'accepted') {
        document.getElementById('install-btn').style.display = 'none';
      }
      _pwaPrompt = null;
    });
  } else {
    alert('Pour installer : ouvrez l\'app via le lanceur BHC, puis cliquez sur ce bouton dans Chrome.');
  }
}

// Service worker registration - only on localhost
if ('serviceWorker' in navigator && location.hostname === 'localhost') {
  navigator.serviceWorker.register('./sw.js')
    .then(() => console.log('SW enregistré'))
    .catch(e => console.log('SW non disponible:', e.message));
}

// INIT
function init(){
  // Logo
  const logoEl = document.getElementById('topbarLogo');
  if(logoEl) logoEl.src = LOGO_TOPBAR;
  // Dark mode
  const theme=localStorage.getItem('bhc-theme')||'light';
  document.documentElement.setAttribute('data-theme',theme);
  updateDarkIcon();
  try{document.getElementById('topDate').textContent=new Date().toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'long'});}catch(e){document.getElementById('topDate').textContent=new Date().toLocaleDateString();}
  loadStorage();render();updateNotifBadge();
  requestNotifPermission();
  // Lancer la vérification automatique toutes les minutes
  setInterval(checkRemindersDue,60000);
  // Vérifier au démarrage si on est déjà à 7h et que les rappels n'ont pas été envoyés
  checkRemindersDue();
  // Alerte si chantiers demain (au démarrage)
  setTimeout(()=>{
    const tom=getChantiersTomorrow();
    if(tom.length>0&&!reminderAlreadySentToday()){
      const alerte=document.createElement('div');
      alerte.id='reminder-banner';
      alerte.style.cssText='position:fixed;bottom:20px;right:20px;background:#F59E0B;color:white;border-radius:12px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:500;display:flex;align-items:center;gap:12px;max-width:320px;cursor:pointer';
      alerte.innerHTML=`<div style="font-size:22px">\u23F0</div><div><div style="font-weight:700;font-size:14px">${tom.length} chantier${tom.length>1?'s':''} demain</div><div style="font-size:12px;opacity:0.9">Cliquez pour envoyer les rappels aux employ\u00e9s</div></div><button onclick="document.getElementById('reminder-banner').remove()" style="background:rgba(255,255,255,0.2);border:none;color:white;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:14px">✕</button>`;
      alerte.onclick=(e)=>{if(e.target.tagName!=='BUTTON'){openReminderModal(false);alerte.remove();}};
      document.body.appendChild(alerte);
      setTimeout(()=>{if(document.getElementById('reminder-banner'))document.getElementById('reminder-banner').remove();},15000);
    }
  },1500);
}
init();
