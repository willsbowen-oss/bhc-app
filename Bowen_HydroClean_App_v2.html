<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bowen HydroClean — Gestion v2</title>
<!-- PWA Meta Tags -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BHC Gestion">
<meta name="theme-color" content="#0B1F3A">
<meta name="description" content="Application de gestion Bowen HydroClean">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy2:#142944;--navy3:#1e3a5f;--blue:#0EA5E9;--blue2:#38BDF8;--accent:#00D4FF;--green:#10B981;--green2:#D1FAE5;--orange:#F59E0B;--orange2:#FEF3C7;--red:#EF4444;--red2:#FEE2E2;--bg:#F0F4F8;--white:#fff;--gray:#64748B;--gray2:#94A3B8;--border:#E2E8F0;--text:#0F172A}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4,.logo-text,.stat-value,.total-big{font-family:'Syne',sans-serif}
.topbar{background:var(--navy);padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0;gap:10px}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo-text{font-weight:800;font-size:15px;color:white;letter-spacing:-0.3px}
.logo-sub{font-size:9px;color:var(--accent);font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-top:-2px}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-date{color:var(--gray2);font-size:11px}
.save-indicator{font-size:11px;color:var(--green);display:flex;align-items:center;gap:4px;transition:opacity 0.5s}
.save-indicator.hidden{opacity:0}
.notif-bell{background:none;border:none;color:var(--gray2);cursor:pointer;padding:6px;border-radius:8px;position:relative;display:flex}
.notif-bell:hover{color:white}
.notif-badge{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--red);color:white;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.main{display:flex;flex:1;overflow:hidden;min-width:0}
.sidebar{background:var(--navy2);width:200px;flex-shrink:0;padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-section{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--gray);text-transform:uppercase;padding:14px 10px 5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;cursor:pointer;color:var(--gray2);font-size:13px;font-weight:500;transition:all 0.12s;border:none;background:none;width:100%;text-align:left;position:relative}
.nav-item:hover{color:white;background:rgba(255,255,255,0.07)}
.nav-item.active{color:white;background:var(--blue);box-shadow:0 4px 14px rgba(14,165,233,0.4)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-badge{position:absolute;right:10px;background:var(--orange);color:white;border-radius:10px;font-size:9px;font-weight:700;padding:2px 6px}
.content{flex:1;padding:22px;overflow-y:auto;overflow-x:hidden;min-width:0;max-width:100%}
.card{background:white;border-radius:14px;padding:20px;border:1px solid var(--border);min-width:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:white;border-radius:12px;padding:18px;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform 0.15s,box-shadow 0.15s;min-width:0}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.stat-label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:800;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--gray2);margin-top:4px}
.stat-icon{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.si-blue{background:#E0F2FE;color:var(--blue)}.si-green{background:#D1FAE5;color:var(--green)}.si-orange{background:#FEF3C7;color:var(--orange)}.si-navy{background:#E0F2FE;color:var(--navy)}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:800}
.page-sub{font-size:12px;color:var(--gray);margin-top:2px}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.13s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.btn-primary{background:var(--blue);color:white;box-shadow:0 4px 12px rgba(14,165,233,0.3)}
.btn-primary:hover{background:#0284C7;transform:translateY(-1px)}
.btn-ai{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;box-shadow:0 4px 12px rgba(14,31,58,0.3)}
.btn-ai:hover{transform:translateY(-1px)}
.btn-secondary{background:white;color:var(--text);border:1.5px solid var(--border)}
.btn-secondary:hover{border-color:var(--blue);color:var(--blue)}
.btn-green{background:var(--green);color:white}
.btn-green:hover{background:#059669}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ghost{background:none;border:none;color:var(--gray);padding:6px 9px;border-radius:8px;font-family:'DM Sans',sans-serif;cursor:pointer}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:2px solid var(--border)}
td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F8FAFC}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:#D1FAE5;color:#059669}.bo{background:#FEF3C7;color:#D97706}.bb{background:#E0F2FE;color:#0284C7}.bn{background:#F1F5F9;color:#64748B}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg.full{grid-column:1/-1}
label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.5px}
input,select,textarea{border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border 0.12s;background:white;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,165,233,0.1)}
textarea{resize:vertical;min-height:75px}
.section-title{font-size:15px;font-weight:700;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.timeline{display:flex;margin:12px 0 4px}
.tl-step{flex:1;text-align:center;position:relative}
.tl-step::before{content:'';position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0}
.tl-step:last-child::before{display:none}
.tl-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);background:white;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:10px;font-weight:700}
.tl-dot.done{background:var(--green);border-color:var(--green);color:white}
.tl-dot.active{background:var(--blue);border-color:var(--blue);color:white}
.tl-label{font-size:9px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:0.5px}
.email-card{background:white;border:1.5px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.13s}
.email-card:hover,.email-card.sel{border-color:var(--blue);background:#F0F9FF}
.email-preview{background:#F8FAFC;border-radius:9px;padding:14px;font-size:12px;line-height:1.75;color:var(--text);white-space:pre-line;border:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
.modal{background:white;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:24px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-size:18px;font-weight:800}
.ai-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
.ai-box{background:white;border-radius:18px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:24px;border:2px solid var(--blue)}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.ai-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ai-title{font-size:16px;font-weight:800;color:var(--navy)}
.ai-sub{font-size:11px;color:var(--gray)}
.ai-result{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:16px;font-size:13px;line-height:1.7;white-space:pre-line;min-height:80px;color:var(--text)}
.ai-loading{display:flex;align-items:center;gap:10px;padding:20px;color:var(--gray)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 1s ease-in-out infinite}
.pulse:nth-child(2){animation-delay:.2s}.pulse:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1)}}
.notif-panel{position:fixed;top:56px;right:12px;width:300px;background:white;border-radius:14px;border:1.5px solid var(--border);box-shadow:0 16px 48px rgba(0,0,0,0.15);z-index:150;padding:16px;animation:slideDown 0.2s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.notif-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.devis-line{display:grid;grid-template-columns:2fr 90px 90px 34px;gap:8px;align-items:center;margin-bottom:10px}
.chart-wrap{position:relative;height:120px}
.bottom-nav{display:none;background:var(--navy);padding:6px 8px;gap:2px;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bn-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--gray2);border:none;background:none;font-family:'DM Sans',sans-serif;position:relative}
.bn-item.active{color:var(--accent)}
.bn-label{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.bn-badge{position:absolute;top:2px;right:10px;width:14px;height:14px;background:var(--orange);color:white;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center}
.alert{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.alert-orange{background:var(--orange2);color:#92400E;border-left:3px solid var(--orange)}
.alert-blue{background:#EFF6FF;color:#1e40af;border-left:3px solid var(--blue)}
.feature-tag{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--navy),var(--navy3));color:var(--accent);font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:1px;text-transform:uppercase}
.copy-btn{background:var(--navy);color:white;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;transition:background 0.12s}
.copy-btn:hover{background:var(--blue)}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.mini-stat{background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.mini-stat-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--navy)}
.mini-stat-lbl{font-size:10px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.25s ease}
/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;text-align:center;padding:6px 0;letter-spacing:0.5px}
.cal-day{min-height:72px;background:white;border-radius:10px;border:1.5px solid var(--border);padding:6px;cursor:pointer;transition:all 0.12s;position:relative}
.cal-day:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 12px rgba(14,165,233,0.12)}
.cal-day.today{border-color:var(--blue);background:#F0F9FF}
.cal-day.other-month{background:#F8FAFC;opacity:0.5}
.cal-day.has-event{border-color:var(--blue)}
.cal-day-num{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.cal-day.today .cal-day-num{color:var(--blue)}
.cal-event{font-size:9px;font-weight:600;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.cal-ev-planifie{background:#FEF3C7;color:#92400E}
.cal-ev-encours{background:#E0F2FE;color:#075985}
.cal-ev-termine{background:#D1FAE5;color:#065F46}
.cal-ev-attente{background:#F1F5F9;color:#475569}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-month{font-size:20px;font-weight:800;color:var(--navy)}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-leg-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--gray)}
.cal-leg-dot{width:10px;height:10px;border-radius:3px}
/* DATES PROPOSÉES */
.date-prop-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.date-prop-row input{flex:1}
.date-prop-badge{font-size:11px;font-weight:700;color:var(--blue);background:#E0F2FE;padding:2px 8px;border-radius:6px;white-space:nowrap}
@media(max-width:700px){
  .grid2,.form-grid{grid-template-columns:1fr}
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .content{padding:12px}
  .main{overflow:visible}
  .content{overflow-y:auto;max-height:none}
  body{height:auto;overflow:auto}
  .page-header{flex-direction:column;align-items:flex-start}
  .page-header .hdr-actions{width:100%;justify-content:flex-start}
  .stat-grid{grid-template-columns:1fr 1fr}
  .modal{padding:16px;max-height:95vh}
  .topbar-date{display:none}
  .devis-line{grid-template-columns:1fr 70px 70px 30px}
  table{font-size:12px}
  th,td{padding:8px}
  .card{padding:14px}
  .stat-value{font-size:20px}
  .cal-day{min-height:52px;padding:4px}
  .cal-day-num{font-size:11px}
  .cal-event{font-size:8px}
  .btn{padding:8px 12px;font-size:12px}
  .btn-sm{padding:5px 10px;font-size:11px}
}
@media(max-width:400px){
  .stat-grid{grid-template-columns:1fr}
  .stat-card{padding:14px}
}

/* ── DARK MODE ─────────────────────────────────────────── */
*{transition:background-color 0.2s ease,color 0.1s ease,border-color 0.15s ease}
[data-theme="dark"]{
  --navy:#1e3a5f;--navy2:#162d4a;--navy3:#1e3a5f;
  --blue:#38BDF8;--blue2:#7DD3FC;--accent:#38BDF8;
  --green:#34D399;--green2:#064e3b;
  --orange:#FBBF24;--orange2:#2d1f00;
  --red:#F87171;--red2:#3b0a0a;
  --bg:#0f172a;--white:#1e293b;--gray:#94A3B8;--gray2:#64748B;
  --border:#334155;--text:#F1F5F9
}
[data-theme="dark"] body{background:#0f172a;color:#F1F5F9}
[data-theme="dark"] .card,[data-theme="dark"] .stat-card,[data-theme="dark"] .email-card{background:#1e293b;border-color:#334155}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:#0f172a;color:#F1F5F9;border-color:#334155}
[data-theme="dark"] input::placeholder,[data-theme="dark"] textarea::placeholder{color:#475569}
[data-theme="dark"] .modal,[data-theme="dark"] .ai-box{background:#1e293b;color:#F1F5F9}
[data-theme="dark"] .modal-title,[data-theme="dark"] .ai-title{color:#F1F5F9}
[data-theme="dark"] .notif-panel{background:#1e293b;border-color:#334155}
[data-theme="dark"] .btn-secondary{background:#1e293b;color:#F1F5F9;border-color:#334155}
[data-theme="dark"] .btn-secondary:hover{border-color:var(--blue);color:var(--blue)}
[data-theme="dark"] .btn-ghost{color:#94A3B8}
[data-theme="dark"] .btn-ghost:hover{background:#334155;color:#F1F5F9}
[data-theme="dark"] tr:hover td{background:#1e293b}
[data-theme="dark"] th{color:#64748B;border-color:#334155}
[data-theme="dark"] td{border-color:#1e293b}
[data-theme="dark"] .mini-stat,[data-theme="dark"] .stats-row .mini-stat{background:#0f172a}
[data-theme="dark"] .mini-stat-val{color:#F1F5F9}
[data-theme="dark"] .cal-day{background:#1e293b;border-color:#334155}
[data-theme="dark"] .cal-day.today{background:#162d4a;border-color:var(--blue)}
[data-theme="dark"] .cal-day.other-month{background:#0f172a}
[data-theme="dark"] .cal-day-num{color:#F1F5F9}
[data-theme="dark"] .email-preview{background:#0f172a;border-color:#334155;color:#F1F5F9}
[data-theme="dark"] .tl-dot{background:#1e293b;border-color:#334155;color:#F1F5F9}
[data-theme="dark"] label{color:#64748B}
[data-theme="dark"] .section-title{color:#F1F5F9}
[data-theme="dark"] .page-title{color:#F1F5F9}
[data-theme="dark"] .si-navy{background:#162d4a}
[data-theme="dark"] .si-blue{background:#0c2340}
[data-theme="dark"] .si-green{background:#064e3b}
[data-theme="dark"] .si-orange{background:#2d1f00}
[data-theme="dark"] .date-prop-badge{background:#162d4a}
[data-theme="dark"] .feature-tag{background:linear-gradient(135deg,#0f172a,#1e3a5f)}
[data-theme="dark"] .alert-orange{background:#2d1f00;color:#FBBF24}
[data-theme="dark"] .alert-blue{background:#0c2340;color:#38BDF8}
[data-theme="dark"] .bn-item{color:#475569}
[data-theme="dark"] .nav-section{color:#475569}
[data-theme="dark"] .save-indicator.hidden{opacity:0}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <img src="" id="topbarLogo" alt="Bowen HydroClean" style="height:38px;width:auto;object-fit:contain;display:block">
  </div>
  <div class="topbar-right">
    <span class="save-indicator hidden" id="saveInd">✓ Sauvegardé</span>
    <button id="install-btn" onclick="installPWA()" title="Installer l'application" style="display:none;background:linear-gradient(135deg,#0EA5E9,#0369a1);color:white;border:none;border-radius:9px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;align-items:center;gap:5px;font-family:'DM Sans',sans-serif">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Installer

function itineraireUrl(adresse,ville){
  const dest=[adresse,ville,'Suisse'].filter(Boolean).join(', ');
  return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(BASE_ADDRESS)+'&destination='+encodeURIComponent(dest);
}

function btnItineraire(adresse,ville,size='btn-sm'){
  const url=itineraireUrl(adresse,ville);
  const dest=[adresse,ville].filter(Boolean).join(', ');
  if(!dest.trim())return'';
  return`<a href="${url}" target="_blank" class="btn ${size}" style="background:#4285F4;color:white;text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-size:${size==='btn-sm'?'11':'12'}px">

    Itinéraire
  </a>`;
}

  try{localStorage.setItem(map[field],JSON.stringify(state[field]));showSaveIndicator();}catch(e){}
}
function showSaveIndicator(){
  const el=document.getElementById('saveInd');if(!el)return;
  el.classList.remove('hidden');clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.add('hidden'),2000);
}

// NOTIFICATIONS
function badgeHtml(statut){
  const map={
    'Terminé':'<span class="badge bg">Terminé</span>',
    'En cours':'<span class="badge bb">En cours</span>',
    'Planifié':'<span class="badge bo">Planifié</span>',
    'En attente':'<span class="badge bn">En attente</span>',
    'Annulé':'<span class="badge" style="background:#FEE2E2;color:#DC2626">Annulé</span>',
  };
  return map[statut]||`<span class="badge bn">${statut}</span>`;
}

function formatDate(d){
  if(!d)return '—';
  try{
    const [y,m,j]=d.split('-');
    return `${j}.${m}.${y}`;
  }catch(e){return d;}
}

function formatMontant(n){
  return 'CHF '+(Math.round(n||0)).toLocaleString('fr-CH');
}

function formatTel(tel){
  if(!tel)return '—';
  return tel;
}

function getClientById(id){
  return state.clients.find(c=>c.id===id)||null;
}

function getChanById(id){
  return state.chantiers.find(c=>c.id===id)||null;
}

function getChantiersTomorrow(){
  const tom=new Date();tom.setDate(tom.getDate()+1);
  const y=tom.getFullYear(),m=String(tom.getMonth()+1).padStart(2,'0'),d=String(tom.getDate()).padStart(2,'0');
  const tomStr=`${y}-${m}-${d}`;
  return state.chantiers.filter(c=>c.date===tomStr&&c.statut!=='Terminé');
}

function reminderAlreadySentToday(){
  const today=new Date().toISOString().split('T')[0];
  return localStorage.getItem('bhc-reminder-sent')===today;
}

function markReminderSentToday(){
  localStorage.setItem('bhc-reminder-sent',new Date().toISOString().split('T')[0]);
}

function openReminderModal(auto){
  const chantiers=getChantiersTomorrow();
  if(!chantiers.length){if(auto)return;alert('Aucun chantier planifié demain.');return;}
  if(auto&&reminderAlreadySentToday())return;
  const tom=new Date();tom.setDate(tom.getDate()+1);
  const tomLabel=tom.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'});
  let rows='';
  chantiers.forEach(c=>{
    const emps=(c.employes||[]).map(id=>state.employes.find(e=>e.id===id)).filter(Boolean);
    const client=state.clients.find(x=>x.nom===c.client)||{};
    const addr=[c.adresse||client.adresse||'',c.ville||client.ville||''].filter(Boolean).join(', ');
    rows+=`<div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="font-weight:700;font-size:14px;margin-bottom:3px">${c.client}</div>
      <div style="font-size:12px;color:var(--gray);margin-bottom:10px">${c.type} · ${c.surface}m² · ${addr}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${emps.map(e=>`
          <div style="display:flex;align-items:center;justify-content:space-between;background:white;padding:8px 12px;border-radius:8px">
            <span style="font-size:13px;font-weight:600">${e.nom}</span>
            <div style="display:flex;gap:6px">
              <button class="btn btn-sm" style="background:#25D366;color:white" onclick="envoyerRappelWA(${c.id},${e.id})">WA</button>
              <button class="btn btn-secondary btn-sm" onclick="envoyerRappelEmail(${c.id},${e.id})">Email</button>
            </div>
          </div>`).join('')}
        ${emps.length===0?`<div style="font-size:12px;color:var(--gray)">Aucun employé affecté</div>`:''}
      </div>
    </div>`;
  });
  document.getElementById('modalContent').innerHTML=`
    <div class="modal-header">
      <div><div class="modal-title">⏰ Rappels demain</div><div style="font-size:12px;color:var(--gray)">${tomLabel} · ${chantiers.length} chantier${chantiers.length>1?'s':''}</div></div>
      <button class="btn-ghost" onclick="closeModal()">✕</button>
    </div>
    ${rows}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-primary btn-sm" onclick="envoyerTousRappels()">Envoyer tous</button>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">Fermer</button>
    </div>`;
  openModal();
  markReminderSentToday();
}

function getNotifications(){
  const now=new Date(),notifs=[];
  state.chantiers.forEach(c=>{
    if(c.statut==='Terminé')return;
    const diff=Math.ceil((new Date(c.date)-now)/(864e5));
    if(diff>=0&&diff<=7)notifs.push({type:'urgent',text:`${c.client} — ${c.type}`,sub:`Dans ${diff===0?'aujourd\'hui':diff+' jours'} · ${c.ville}`,color:'orange'});
  });
  const ec=state.chantiers.filter(c=>c.statut==='En cours');
  if(ec.length)notifs.push({type:'info',text:`${ec.length} chantier${ec.length>1?'s':''} en cours`,sub:'Mise à jour du statut recommandée',color:'blue'});
  // Rappels devis sans réponse > 7 jours
  state.devisLog.filter(d=>d.statut==='envoyé'||d.statut==='en attente').forEach(d=>{
    const jours=Math.floor((now-new Date(d.dateEnvoi))/864e5);
    if(jours>=7)notifs.push({type:'rappel',text:`Rappel devis ${d.num} — ${d.client}`,sub:`Envoyé il y a ${jours} jours · CHF ${d.ttc.toFixed(0)}`,color:'red'});
  });
  return notifs;
}
function updateNotifBadge(){
  const n=getNotifications(),badge=document.getElementById('notifCount');
  if(!badge)return;
  n.length>0?(badge.style.display='flex',badge.textContent=n.length):badge.style.display='none';
  document.querySelectorAll('.nav-badge,.bn-badge').forEach(b=>b.remove());
  const urgent=n.filter(x=>x.type==='urgent').length;
  if(urgent>0){
    const nc=document.getElementById('nav-chantiers');
    if(nc){const b=document.createElement('span');b.className='nav-badge';b.textContent=urgent;nc.appendChild(b);}
  }
}
function toggleNotifs(){
  notifOpen=!notifOpen;
  const panel=document.getElementById('notifPanel');
  if(!notifOpen){panel.style.display='none';return;}
  const notifs=getNotifications();
  panel.innerHTML=notifs.length===0?`<div style="text-align:center;padding:20px;color:var(--gray)">✅ Tout est à jour !</div>`:
    `<div style="font-size:12px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Notifications (${notifs.length})</div>`+
    notifs.map(n=>`<div class="notif-item"><div class="notif-dot" style="background:${n.color==='orange'?'var(--orange)':'var(--blue)'}"></div><div><div style="font-size:13px;font-weight:600">📅 ${n.text}</div><div style="font-size:11px;color:var(--gray)">${n.sub}</div></div></div>`).join('');
  panel.style.display='block';
  setTimeout(()=>document.addEventListener('click',e=>{if(!panel.contains(e.target)&&!document.querySelector('.notif-bell').contains(e.target)){panel.style.display='none';notifOpen=false;}},{once:true}),10);
}

// NAVIGATION
function navigate(page){
  state.page=page;
  if(chartInstance){chartInstance.destroy();chartInstance=null;}
  document.querySelectorAll('.nav-item,.bn-item').forEach(b=>{
    b.classList[b.getAttribute('onclick')&&b.getAttribute('onclick').includes(`'${page}'`)?'add':'remove']('active');
  });
  render();updateNotifBadge();
}
function render(){
  const c=document.getElementById('content');
  c.className='content fade-in';
  if(state.page==='dashboard')c.innerHTML=renderDashboard();
  else if(state.page==='clients')c.innerHTML=renderClients();
  else if(state.page==='equipe')c.innerHTML=renderEquipe();
  else if(state.page==='chantiers')c.innerHTML=renderChantiers();
  else if(state.page==='calendrier')c.innerHTML=renderCalendrier();
  else if(state.page==='devis')c.innerHTML=renderDevis();
  else if(state.page==='factures')c.innerHTML=renderFactures();
  else if(state.page==='rapport')c.innerHTML=renderRapport();
  else if(state.page==='marketing')c.innerHTML=renderMarketing();
  else if(state.page==='emails')c.innerHTML=renderEmails();
  if(state.page==='dashboard'){setTimeout(initChart,50);setTimeout(fetchMeteo,100);}
  setTimeout(initSwipe,50);
  // Update nav badges
  document.querySelectorAll('.nav-item,.bn-item').forEach(el=>{
    const id=el.id?.replace('nav-','');
    el.classList.toggle('active',id===state.page);
  });
}

function renderDashboard(){
  const now=new Date();
  const mois=now.getMonth(),annee=now.getFullYear();
  const ter=state.chantiers.filter(c=>c.statut==='Terminé');
  const totalRev=ter.reduce((s,c)=>s+c.montant,0);

  const planifié=state.chantiers.filter(c=>c.statut==='Planifié'||c.statut==='En attente').length;
  const totalSurf=state.chantiers.reduce((s,c)=>s+c.surface,0);
  const avgRev=ter.length?Math.round(totalRev/ter.length):0;
  const convRate=state.chantiers.length?Math.round(ter.length/state.chantiers.length*100):0;
  const notifs=getNotifications().filter(n=>n.type==='urgent');
  const alertHtml=notifs.length?`<div class="alert alert-orange">📅 <strong>${notifs.length} chantier${notifs.length>1?'s':''} prévu${notifs.length>1?'s':''} dans les 7 prochains jours</strong> — Pensez à confirmer avec vos clients.</div>`:'';
  const recent=[...state.chantiers].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,4);

  // Stats avancées
  const revMois=state.chantiers.filter(c=>c.statut==='Terminé'&&new Date(c.date).getMonth()===mois&&new Date(c.date).getFullYear()===annee).reduce((s,c)=>s+c.montant,0);
  const revMoisPrec=state.chantiers.filter(c=>{const d=new Date(c.date);const pm=mois===0?11:mois-1;const pa=mois===0?annee-1:annee;return c.statut==='Terminé'&&d.getMonth()===pm&&d.getFullYear()===pa;}).reduce((s,c)=>s+c.montant,0);
  const evol=revMoisPrec>0?Math.round((revMois-revMoisPrec)/revMoisPrec*100):0;
  const objectif=state.settings.objectifMensuel||5000;
  const pctObj=Math.min(100,Math.round(revMois/objectif*100));
  // Meilleure prestation
  const byType={};ter.forEach(c=>{byType[c.type]=(byType[c.type]||0)+c.montant;});
  const bestType=Object.entries(byType).sort((a,b)=>b[1]-a[1])[0];
  // Factures impayées
  const impayees=state.factures.filter(f=>f.statut==='envoyée'&&new Date(f.dateEcheance)<now);

  // Employee performance this month
  const hMois=state.heures.filter(h=>new Date(h.date).getMonth()===mois&&new Date(h.date).getFullYear()===annee);
  const empPerf=state.employes.filter(e=>e.actif).map(e=>{
    const hEmp=hMois.filter(h=>h.employeId===e.id);
    const heures=hEmp.reduce((s,h)=>s+h.heures,0);
    const salaire=Math.round(heures*e.tauxHoraire);
    const chantiersIds=[...new Set(hEmp.map(h=>h.chantierId))];
    const surf=chantiersIds.reduce((s,cid)=>{const c=state.chantiers.find(x=>x.id===cid);return s+(c?c.surface:0);},0);
    const mPh=heures>0?Math.round(surf/heures):0;
    const chantiersActifs=state.chantiers.filter(c=>c.statut!=='Terminé'&&(c.employes||[]).includes(e.id)).length;
    return{e,heures,salaire,surf,mPh,chantiersIds:chantiersIds.length,chantiersActifs};
  });

// METEO DOMDIDIER
// ══════════════════════════════════════════════════════════
async function fetchMeteo(){
  const icon=document.getElementById('meteo-icon');
  const temp=document.getElementById('meteo-temp');
  const desc=document.getElementById('meteo-desc');
  const extra=document.getElementById('meteo-extra');
  if(!icon)return;
  icon.textContent='...';desc.textContent='Chargement...';
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.9&longitude=7.02&current=temperature_2m,weathercode,windspeed_10m,precipitation&hourly=precipitation_probability&timezone=Europe%2FZurich&forecast_days=1',{method:'GET',mode:'cors'});
    const d=await r.json();
    const t=Math.round(d.current.temperature_2m);
    const code=d.current.weathercode;
    const wind=Math.round(d.current.windspeed_10m);
    const rainProb=d.hourly&&d.hourly.precipitation_probability?d.hourly.precipitation_probability[new Date().getHours()]||0:0;
    const rain=d.current.precipitation||0;
    const icons={0:'sunny',1:'partly',2:'cloudy',3:'overcast',45:'fog',48:'fog',51:'drizzle',53:'drizzle',55:'rain',61:'rain',63:'rain',65:'rain',71:'snow',73:'snow',75:'snow',80:'shower',81:'shower',82:'storm',95:'storm',96:'storm',99:'storm'};
    const emojs={sunny:'sunny',partly:'partly',cloudy:'cloudy',overcast:'overcast',fog:'fog',drizzle:'drizzle',rain:'rain',snow:'snow',shower:'shower',storm:'storm'};
    const iconMap={'sunny':'sun','partly':'sun_cloud','cloudy':'cloud','overcast':'clouds','fog':'fog','drizzle':'light_rain','rain':'rain','snow':'snow','shower':'shower','storm':'lightning'};
    const descs={0:'Ensoleille',1:'Peu nuageux',2:'Partiellement nuageux',3:'Nuageux',45:'Brouillard',48:'Brouillard givrant',51:'Bruine',53:'Bruine',55:'Bruine forte',61:'Pluie legere',63:'Pluie moderee',65:'Forte pluie',71:'Neige legere',73:'Neige',75:'Neige forte',80:'Averses',81:'Averses',82:'Averses fortes',95:'Orage',96:'Orage',99:'Orage violent'};
    const emojiMap={0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧',71:'🌨',73:'🌨',75:'❄️',80:'🌦',81:'🌧',82:'⛈',95:'⛈',96:'⛈',99:'⛈'};
    icon.textContent=emojiMap[code]||'🌡';
    temp.textContent=t+'°C';
    desc.textContent=descs[code]||'Variable';
    extra.textContent='Vent '+wind+' km/h · Pluie '+rainProb+'%';
    const card=document.getElementById('meteo-card');
    const content=document.getElementById('meteo-content');
    if(card&&content){
      const old=content.querySelector('.meteo-conseil');if(old)old.remove();
      const conseil=document.createElement('div');
      conseil.className='meteo-conseil';
      if(rain>0||code>=51){
        card.style.borderTop='3px solid var(--red)';
        conseil.style.cssText='font-size:10px;color:var(--red);font-weight:700;margin-top:8px;text-align:center';
        conseil.textContent='Conditions defavorables';
      } else if(code<=2&&rainProb<30){
        card.style.borderTop='3px solid var(--green)';
        conseil.style.cssText='font-size:10px;color:var(--green);font-weight:700;margin-top:8px;text-align:center';
        conseil.textContent='Ideal pour nettoyage !';
      } else {
        card.style.borderTop='3px solid var(--orange)';
        conseil.style.cssText='font-size:10px;color:var(--orange);font-weight:700;margin-top:8px;text-align:center';
        conseil.textContent='Conditions variables';
      }
      content.appendChild(conseil);
    }
  }catch(e){
    if(icon)icon.textContent='?';
    if(desc)desc.textContent='Non disponible';
    if(temp)temp.textContent='--';
  }
}

function selectionnerPar(critere){
  if(!state.clientSelIds)state.clientSelIds=new Set();
  const search=(state.clientSearch||'').toLowerCase();
  const filtered=search
    ?state.clients.filter(c=>c.nom.toLowerCase().includes(search)||(c.tel||'').includes(search)||(c.ville||'').toLowerCase().includes(search))
    :state.clients;
  let toSelect=[];
  if(critere==='sans-adresse') toSelect=state.clients.filter(c=>!c.adresse&&!c.ville);
  else if(critere==='sans-email') toSelect=state.clients.filter(c=>!c.email);
  else if(critere==='sans-chantier') toSelect=state.clients.filter(c=>!c.chantiers||c.chantiers===0);
  else if(critere==='recherche') toSelect=filtered;
  toSelect.forEach(c=>state.clientSelIds.add(c.id));
  render();
  showToast(`☐ ${state.clientSelIds.size} client${state.clientSelIds.size>1?'s':''} sélectionné${state.clientSelIds.size>1?'s':''}`);
}

function toggleClientSelAll(){

function supprimerClientsSelectionnes(){

}

function importerVCF(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const content=e.target.result;
    const vcards=content.split('BEGIN:VCARD');
    const skip=['A Téléphone','Mes contacts','Achat ','Garanti ','Frigo ','Ikea','Migros','Coop','SBB','CFF'];
    const existingTels=new Set(state.clients.map(c=>(c.tel||'').replace(/\s/g,'')));
    let added=0, skipped=0;
    vcards.slice(1).forEach(vcard=>{
      const fnM=vcard.match(/FN:(.+?)[\r\n]/);
      const telM=vcard.match(/TEL[^:]*:(.+?)[\r\n]/);
      const emailM=vcard.match(/EMAIL[^:]*:(.+?)[\r\n]/);
      const orgM=vcard.match(/ORG:(.+?)[\r\n]/);
      if(!fnM)return;
      const nom=fnM[1].trim();
      if(!nom||skip.some(s=>nom.includes(s)))return;
      const tel=(telM?telM[1].trim():'').replace(/[^\d+\s]/g,'').trim();
      const email=emailM?emailM[1].trim():'';
      const org=orgM?orgM[1].trim().replace(/;+$/,''):'';
      // Éviter doublons par numéro de téléphone
      const telClean=tel.replace(/\s/g,'');
      if(telClean&&existingTels.has(telClean)){skipped++;return;}
      if(telClean)existingTels.add(telClean);
      state.clients.push({
        id:state.nextClientId++,
        nom,tel,email,
        adresse:'',ville:'',
        type:org?'Entreprise':'Particulier',
        chantiers:0,specs:{}
      });
      added++;
    });
    saveStorage('clients');
    render();
    showToast('✅ '+added+' contacts importés ! ('+skipped+' doublons ignorés)');
  };
  reader.readAsText(file,'utf-8');
  input.value='';
}

function saveEditClient(id){
  const nom=document.getElementById('ec-nom').value.trim();
  if(!nom)return alert('Le nom est obligatoire.');
  const c=state.clients.find(x=>x.id===id);
  c.nom    = nom;
  c.email  = document.getElementById('ec-email').value.trim();
  c.tel    = document.getElementById('ec-tel').value.trim();
  c.adresse= document.getElementById('ec-adresse').value.trim();
  c.ville  = document.getElementById('ec-ville').value.trim();
  c.type   = document.getElementById('ec-type').value;
  c.specs = {
    produits:  document.getElementById('ec-produits').value.trim(),
    acces:     document.getElementById('ec-acces').value.trim(),
    attention: document.getElementById('ec-attention').value.trim(),
    divers:    document.getElementById('ec-divers').value.trim(),
  };
  saveStorage('clients');
  closeModal();
  render();
}

function deleteClient(id){
  if(!confirm('Supprimer ce client ? Cette action est irréversible.'))return;
  state.clients=state.clients.filter(x=>x.id!==id);
  saveStorage('clients');
  closeModal();
  render();
}

function saveClient(){
  const nom=document.getElementById('c-nom').value.trim();if(!nom)return alert('Veuillez entrer un nom');
  state.clients.push({
    id:state.nextClientId++,nom,
    email:document.getElementById('c-email').value,
    tel:document.getElementById('c-tel').value,
    adresse:document.getElementById('c-adresse').value.trim(),
    ville:document.getElementById('c-ville').value,
    type:document.getElementById('c-type').value,
    chantiers:0,
    specs:{
      produits:document.getElementById('c-produits').value.trim(),
      acces:document.getElementById('c-acces').value.trim(),
      attention:document.getElementById('c-attention').value.trim(),
      divers:document.getElementById('c-divers').value.trim(),
    }
  });
  saveStorage('clients');closeModal();render();
}
function goClientDevis(id){
  const c=state.clients.find(x=>x.id===id);
  state.devisClient=c.nom;
  state.devisVille=c.ville;
  state.devisTel=c.tel||'';
  state.devisEmail=c.email||'';
  navigate('devis');
}

// ── TAB 2 : HEURES & PAIES ──────────────────────────
function renderEquipeHeures(tabBar){
  const now=new Date();
  let moisView=state.heuresMois!==undefined?state.heuresMois:now.getMonth();
  let anneeView=state.heuresAnnee!==undefined?state.heuresAnnee:now.getFullYear();
  const moisNoms=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

  const hMois=state.heures.filter(h=>new Date(h.date).getMonth()===moisView&&new Date(h.date).getFullYear()===anneeView);
  const totalHMois=hMois.reduce((s,h)=>s+h.heures,0);
  const totalSalaire=state.employes.reduce((s,e)=>{
    const h=hMois.filter(h=>h.employeId===e.id).reduce((s2,h2)=>s2+h2.heures,0);
    return s+Math.round(h*e.tauxHoraire);
  },0);

  return `
  <div class="page-header">
    <div><div class="page-title">Équipe</div><div class="page-sub">Heures travaillées & paies</div></div>
    <button class="btn btn-primary" onclick="openSaisieHeures(null)">+ Saisir des heures</button>
  </div>
  ${tabBar}
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <button class="btn btn-secondary btn-sm" onclick="state.heuresMois=${moisView===0?11:moisView-1};state.heuresAnnee=${moisView===0?anneeView-1:anneeView};render()">‹</button>
    <div style="font-family:'Syne',sans-serif;font-size:18px;font-weight:800">${moisNoms[moisView]} ${anneeView}</div>
    <button class="btn btn-secondary btn-sm" onclick="state.heuresMois=${moisView===11?0:moisView+1};state.heuresAnnee=${moisView===11?anneeView+1:anneeView};render()">›</button>
    <div style="margin-left:auto;display:flex;gap:10px">
      <div style="background:var(--bg);border-radius:9px;padding:8px 14px;text-align:center"><span style="font-weight:800;color:var(--navy)">${totalHMois}h</span> <span style="font-size:11px;color:var(--gray)">total</span></div>
      <div style="background:#D1FAE5;border-radius:9px;padding:8px 14px;text-align:center"><span style="font-weight:800;color:var(--green)">CHF ${totalSalaire.toLocaleString()}</span> <span style="font-size:11px;color:var(--gray)">masse salariale</span></div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    ${state.employes.filter(e=>e.actif).map(e=>{
      const hEmp=hMois.filter(h=>h.employeId===e.id);
      const totalH=hEmp.reduce((s,h)=>s+h.heures,0);
      const salaire=Math.round(totalH*e.tauxHoraire);
      const perf=state.chantiers.filter(c=>(c.employes||[]).includes(e.id)&&hEmp.find(h=>h.chantierId===c.id)).reduce((s,c)=>s+c.surface,0);
      const mPh=totalH>0?Math.round(perf/totalH):0;
      return`<div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:white;font-weight:800">${e.nom.charAt(0)}</div>
            <div><div style="font-weight:700">${e.nom}</div><div style="font-size:11px;color:var(--gray)">${e.role} · CHF ${e.tauxHoraire}.—/h</div></div>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <div style="text-align:right"><div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--navy)">${totalH}h</div><div style="font-size:11px;color:var(--gray)">travaillées</div></div>
            <div style="text-align:right;background:#D1FAE5;border-radius:10px;padding:8px 14px"><div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--green)">CHF ${salaire}</div><div style="font-size:11px;color:var(--gray)">salaire estimé</div></div>
          </div>
        </div>
        ${mPh>0?`<div style="font-size:12px;color:var(--gray);margin-bottom:10px">⚡ Performance : <strong>${mPh} m²/h</strong> · ${perf} m² nettoyés ce mois</div>`:''}
        ${hEmp.length>0?`
          <div style="border-top:1px solid var(--border);padding-top:12px">
            <div style="font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Détail des jours</div>
            ${hEmp.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(h=>{
              const chan=state.chantiers.find(c=>c.id===h.chantierId);
              return`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
                <div style="font-size:12px;color:var(--gray);width:90px;flex-shrink:0">${new Date(h.date).toLocaleDateString('fr-CH',{day:'numeric',month:'short'})}</div>
                <div style="flex:1;font-size:13px">${chan?chan.client+' — '+chan.type:'Chantier inconnu'}</div>
                <div style="font-weight:700;color:var(--navy)">${h.heures}h</div>
                <div style="color:var(--green);font-size:12px;font-weight:600">CHF ${Math.round(h.heures*e.tauxHoraire)}</div>
                <button onclick="deleteHeure(${h.id})" class="btn-ghost" style="color:var(--gray2);font-size:12px;padding:3px 6px;border-radius:5px;border:1px solid var(--border)">✕</button>
              </div>`;}).join('')}
          </div>`:`<div style="text-align:center;padding:14px;color:var(--gray);font-size:13px">Aucune heure saisie ce mois</div>`}
        <div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="openSaisieHeures(${e.id})">+ Ajouter des heures</button></div>
      </div>`;}).join('')}
  </div>`;
}

                  <span style="width:18px;height:18px;background:rgba(255,255,255,0.2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px">${e.nom.charAt(0)}</span>${e.nom.split(' ')[0]}

          <div style="text-align:right">
            ${badgeHtml(c.statut)}

function ajouterPhoto(chantierId,type,input){
  const c=state.chantiers.find(x=>x.id===chantierId);
  if(!c)return;
  if(!c.photos)c.photos={avant:[],apres:[]};
  const files=Array.from(input.files);
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=e=>{
      // Resize to max 800px for storage
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const max=800;
        let w=img.width,h=img.height;
        if(w>max){h=Math.round(h*max/w);w=max;}
        if(h>max){w=Math.round(w*max/h);h=max;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        c.photos[type].push(canvas.toDataURL('image/jpeg',0.75));
        loaded++;
        if(loaded===files.length){
          saveStorage('chantiers');
          ouvrirPhotos(chantierId);
          showToast('📸 '+files.length+' photo'+( files.length>1?'s':'')+' ajoutée'+( files.length>1?'s':'')+'!');
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function supprimerPhoto(chantierId,type,index){
  const c=state.chantiers.find(x=>x.id===chantierId);
  if(!c||!c.photos)return;
  c.photos[type].splice(index,1);
  saveStorage('chantiers');
  ouvrirPhotos(chantierId);
}

const VITESSE_M2H={'Terrasse & allée':15,'Façade & mur':10,'Toiture & gouttières':8};

function estimerDuree(type,surface){
  const v=VITESSE_M2H[type]||10;
  const h=surface/v;
  const h05=Math.ceil(h*2)/2; // arrondi 0.5h
  if(h05<1)return'30 min';
  const heures=Math.floor(h05);
  const mins=((h05%1)*60)|0;
  return heures+'h'+(mins?mins:'');
}

function envoyerBriefingWA(chantierId,employeId){

  const client=state.clients.find(x=>x.nom===c.client)||{};
  const sp=client.specs||{};
  // Utiliser UNIQUEMENT l'adresse du chantier, pas celle du client
  const addr=c.adresse||'';
  const ville=c.ville||'';
  const fullAddr=[addr,ville].filter(Boolean).join(', ')||'\u00c0 confirmer';
  const duree=estimerDuree(c.type,c.surface);
  const mapsUrl=itineraireUrl(addr,ville);
  let num=(e.tel||'').replace(/\s/g,'').replace(/[^0-9+]/g,'');
  if(num.startsWith('0'))num='41'+num.slice(1);
  if(num.startsWith('+'))num=num.slice(1);

    EM.briefing+' *BRIEFING CHANTIER \u2014 Bowen HydroClean*\n\n'+
    EM.wave+' Bonjour '+e.nom.split(' ')[0]+',\n\n'+
    'Vous \u00eates planifi\u00e9(e) pour l\u2019intervention suivante :\n\n'+
    EM.cal+' *Date :* '+formatDate(c.date)+'\n'+
    EM.pin+' *Adresse :* '+(fullAddr||'\u00c0 confirmer')+'\n'+
    EM.map+' *Itin\u00e9raire :* '+mapsUrl+'\n\n'+
    EM.person+' *Client :* '+c.client+'\n'+
    EM.phone+' *T\u00e9l. client :* '+(client.tel||'Non renseign\u00e9')+'\n\n'+
    EM.wrench+' *Prestation :* '+c.type+'\n'+
    EM.ruler+' *Surface :* '+c.surface+' m\u00b2\n'+
    EM.timer+' *Dur\u00e9e estim\u00e9e :* '+duree+
    (sp.produits?'\n\n'+EM.soap+' *Produits \u00e0 prendre :*\n'+sp.produits:'')+
    (sp.acces?'\n\n'+EM.key+' *Acc\u00e8s & parking :*\n'+sp.acces:'')+
    (sp.attention?'\n\n'+EM.warning+' *Points d\u2019attention :*\n'+sp.attention:'')+

    '_Bowen HydroClean \u2014 www.bowenhydroclean.ch_';

  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');

function calcChanMontant(){const t=document.getElementById('ch-type')?.value;const s=parseFloat(document.getElementById('ch-surf')?.value)||0;if(t&&s)document.getElementById('ch-mont').value=Math.round((PRIX[t]||7)*s);}

function saveChan(){
  const sel=document.getElementById('ch-client');
  const clientId=parseInt(sel.value);
  const clientObj=state.clients.find(x=>x.id===clientId);
  const client=clientObj?.nom||sel.options[sel.selectedIndex]?.text||'';
  if(!client)return alert('Veuillez sélectionner un client');
  const checked=[...document.querySelectorAll('#emp-checkboxes input[type=checkbox]:checked')].map(cb=>parseInt(cb.value));
  state.chantiers.push({
    id:state.nextChantierId++,client,
    type:document.getElementById('ch-type').value,
    surface:parseFloat(document.getElementById('ch-surf').value)||0,
    adresse:document.getElementById('ch-adresse')?.value.trim()||'',
    ville:document.getElementById('ch-ville').value,
    statut:'Planifié',
    date:document.getElementById('ch-date').value,
    montant:parseFloat(document.getElementById('ch-mont').value)||0,
    notes:document.getElementById('ch-notes').value,
    employes:checked,
  });
  if(clientObj)clientObj.chantiers++;
  saveStorage('chantiers');saveStorage('clients');closeModal();render();updateNotifBadge();
}

// CALENDRIER
function renderCalendrier(){
  const y=state.calYear, m=state.calMonth;
  const monthNames=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const dayNames=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const today=new Date(); today.setHours(0,0,0,0);

  // Build events map: date string → chantiers[]
  const events={};
  state.chantiers.forEach(c=>{
    if(!c.date)return;
    const k=c.date;
    if(!events[k])events[k]=[];
    events[k].push(c);
  });

  // First day of month (Mon=0)
  const firstDay=new Date(y,m,1);
  let startDow=firstDay.getDay()-1; if(startDow<0)startDow=6;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const daysInPrev=new Date(y,m,0).getDate();

  const statClass={'Planifié':'cal-ev-planifie','En cours':'cal-ev-encours','Terminé':'cal-ev-termine','En attente':'cal-ev-attente'};

  let cells='';
  // Fill previous month days
  for(let i=startDow-1;i>=0;i--){
    cells+=`<div class="cal-day other-month"><div class="cal-day-num">${daysInPrev-i}</div></div>`;
  }
  // Current month days
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayDate=new Date(y,m,d); dayDate.setHours(0,0,0,0);
    const isToday=dayDate.getTime()===today.getTime();
    const dayEvents=events[dateStr]||[];
    const hasEv=dayEvents.length>0;
    cells+=`<div class="cal-day${isToday?' today':''}${hasEv?' has-event':''}" onclick="showDayDetail('${dateStr}')">
      <div class="cal-day-num">${d}</div>
      ${dayEvents.slice(0,2).map(c=>{
        const emps=(c.employes||[]).map(eid=>state.employes.find(e=>e.id===eid)).filter(Boolean);
        return`<div class="cal-event ${statClass[c.statut]||'cal-ev-attente'}" title="${c.client} — ${emps.map(e=>e.nom).join(', ')||'Sans employé'}">
          ${c.client.split(' ')[0]}
          ${emps.length>0?`<span style="opacity:0.75;font-size:8px;margin-left:2px">${emps.map(e=>e.nom.charAt(0)).join('')}</span>`:''}
        </div>`;}).join('')}
      ${dayEvents.length>2?`<div style="font-size:9px;color:var(--gray)">+${dayEvents.length-2} autre${dayEvents.length-2>1?'s':''}</div>`:''}
    </div>`;
  }
  // Fill next month
  const totalCells=startDow+daysInMonth;
  const remaining=(7-totalCells%7)%7;
  for(let d=1;d<=remaining;d++){
    cells+=`<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
  }

  // Upcoming list
  const upcoming=[...state.chantiers]
    .filter(c=>c.date&&c.statut!=='Terminé'&&new Date(c.date)>=today)
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .slice(0,6);

  return `
  <div class="page-header">
    <div><div class="page-title">Calendrier</div><div class="page-sub">Vos interventions planifiées</div></div>
    <button class="btn btn-primary btn-sm" onclick="navigate('chantiers')">+ Nouveau chantier</button>
  </div>
  <div class="grid2" style="align-items:start">
    <div>
      <div class="card" style="padding:18px">
        <div class="cal-nav">
          <button class="btn btn-secondary btn-sm" onclick="calPrev()">‹ Préc.</button>
          <div class="cal-month">${monthNames[m]} ${y}</div>
          <button class="btn btn-secondary btn-sm" onclick="calNext()">Suiv. ›</button>
        </div>
        <div class="cal-legend">
          <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#FEF3C7;border:1px solid #D97706"></div>Planifié</div>
          <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#E0F2FE;border:1px solid #0284C7"></div>En cours</div>
          <div class="cal-leg-item"><div class="cal-leg-dot" style="background:#D1FAE5;border:1px solid #059669"></div>Terminé</div>
        </div>
        <div class="cal-grid">
          ${dayNames.map(d=>`<div class="cal-head">${d}</div>`).join('')}
          ${cells}
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="section-title">📅 Prochaines interventions</div>
        ${upcoming.length===0?`<div style="text-align:center;padding:20px;color:var(--gray);font-size:13px">Aucune intervention planifiée</div>`
          :upcoming.map(c=>{
            const diff=Math.ceil((new Date(c.date)-today)/864e5);
            return`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
              <div style="width:42px;height:42px;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0">
                <div style="font-size:16px;font-weight:800;color:var(--navy);line-height:1">${new Date(c.date).getDate()}</div>
                <div style="font-size:9px;font-weight:700;color:var(--gray);text-transform:uppercase">${'JanFévMarAvrMaiJunJulAoûSepOctNovDéc'.match(/.{3}/g)[new Date(c.date).getMonth()]}</div>
              </div>
              <div style="flex:1">
                <div style="font-weight:700;font-size:13px">${c.client}</div>
                <div style="font-size:11px;color:var(--gray)">${c.type} · ${c.ville}</div>
              </div>
              <div style="text-align:right">
                ${badgeHtml(c.statut)}
                <div style="font-size:10px;color:${diff<=2?'var(--red)':diff<=7?'var(--orange)':'var(--gray)'};margin-top:3px;font-weight:600">
                  ${diff===0?'Aujourd\'hui':diff===1?'Demain':'Dans '+diff+' j.'}
                </div>
              </div>
            </div>`;}).join('')}
      </div>
      <div class="card">
        <div class="section-title">📊 Ce mois — ${monthNames[m]}</div>
        ${(()=>{
          const monthChan=state.chantiers.filter(c=>c.date&&new Date(c.date).getMonth()===m&&new Date(c.date).getFullYear()===y);
          const rev=monthChan.filter(c=>c.statut==='Terminé').reduce((s,c)=>s+c.montant,0);
          return`<div class="stats-row" style="margin-top:0">
            <div class="mini-stat"><div class="mini-stat-val">${monthChan.length}</div><div class="mini-stat-lbl">Chantiers</div></div>
            <div class="mini-stat"><div class="mini-stat-val">${monthChan.filter(c=>c.statut==='Terminé').length}</div><div class="mini-stat-lbl">Terminés</div></div>
            <div class="mini-stat"><div class="mini-stat-val" style="font-size:14px">${rev?'CHF '+rev:'-'}</div><div class="mini-stat-lbl">Revenus</div></div>
          </div>`;
        })()}
      </div>
    </div>
  </div>
  <div id="dayDetail"></div>`;
}

function calPrev(){
  if(state.calMonth===0){state.calMonth=11;state.calYear--;}
  else state.calMonth--;
  render();
}
function calNext(){
  if(state.calMonth===11){state.calMonth=0;state.calYear++;}
  else state.calMonth++;
  render();
}
function showDayDetail(dateStr){
  const chans=state.chantiers.filter(c=>c.date===dateStr);
  if(!chans.length)return;
  const d=new Date(dateStr);
  const label=d.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('dayDetail').innerHTML=`
    <div style="margin-top:16px" class="card">
      <div style="font-size:15px;font-weight:800;margin-bottom:12px;color:var(--navy)">📅 ${label}</div>
      ${chans.map(c=>{
        const emps=(c.employes||[]).map(eid=>state.employes.find(e=>e.id===eid)).filter(Boolean);
        const hChan=state.heures.filter(h=>h.chantierId===c.id&&h.date===dateStr);
        const totalH=hChan.reduce((s,h)=>s+h.heures,0);
        return`<div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px">
            <div>
              <div style="font-weight:700;font-size:14px">${c.client}</div>
              <div style="font-size:12px;color:var(--gray)">${c.type} · ${c.surface} m²${(()=>{const addr=c.adresse||(state.clients.find(x=>x.nom===c.client)?.adresse||'');const v=c.ville||(state.clients.find(x=>x.nom===c.client)?.ville||'');return[addr,v].filter(Boolean).length?' · 📍 '+[addr,v].filter(Boolean).join(', '):'';})()}</div>
              ${(()=>{const addr=c.adresse||(state.clients.find(x=>x.nom===c.client)?.adresse||'');const v=c.ville||(state.clients.find(x=>x.nom===c.client)?.ville||'');return addr||v?`<div style="margin-top:5px">${btnItineraire(addr,v)}</div>`:'';})()}
              ${c.notes?`<div style="font-size:11px;color:var(--gray);margin-top:3px">📝 ${c.notes}</div>`:''}
            </div>
            <div style="text-align:right;flex-shrink:0">
              ${badgeHtml(c.statut)}
              <div style="font-weight:700;margin-top:4px;font-size:13px">CHF ${c.montant}</div>
            </div>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:10px">
            <div style="font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">👷 Équipe</div>
            ${emps.length>0
              ?`<div style="display:flex;flex-wrap:wrap;gap:8px">
                  ${emps.map(e=>{
                    const hEmp=hChan.find(h=>h.employeId===e.id);
                    return`<div style="display:flex;align-items:center;gap:7px;background:white;border:1px solid var(--border);border-radius:9px;padding:7px 11px">
                      <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--navy),var(--blue));display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:11px;flex-shrink:0">${e.nom.charAt(0)}</div>
                      <div>
                        <div style="font-weight:600;font-size:12px">${e.nom}</div>
                        <div style="font-size:10px;color:var(--gray)">${e.role}</div>
                      </div>
                      ${hEmp?`<div style="margin-left:6px;background:#D1FAE5;color:#059669;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${hEmp.heures}h</div>`:''}
                    </div>`;}).join('')}
                </div>
                ${totalH>0?`<div style="margin-top:8px;font-size:11px;color:var(--gray)">⏱ Total ce jour : <strong>${totalH}h</strong></div>`:
                  `<div style="margin-top:6px">
                    <button class="btn btn-secondary btn-sm" onclick="openSaisieHeures(null);document.getElementById('h-chan').value='${c.id}'">+ Saisir des heures</button>
                  </div>`}`
              :`<div style="display:flex;align-items:center;gap:10px">
                  <span style="font-size:12px;color:var(--gray);font-style:italic">Aucun employé affecté</span>
                  <button class="btn btn-secondary btn-sm" onclick="openAffectation(${c.id})">+ Affecter</button>
                </div>`}
          </div>
        </div>`;}).join('')}
    </div>`;
}

// DEVIS
function renderDevis(){
  const tab=state.devisTab||'nouveau';
  const rappels=state.devisLog.filter(d=>(d.statut==='envoyé'||d.statut==='en attente')&&Math.floor((new Date()-new Date(d.dateEnvoi))/864e5)>=7).length;
  const tabBar=`<div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap">
    <button onclick="state.devisTab='nouveau';render()" class="btn ${tab==='nouveau'?'btn-primary':'btn-secondary'} btn-sm">✏️ Nouveau devis</button>
    <button onclick="state.devisTab='envoyes';render()" class="btn ${tab==='envoyes'?'btn-primary':'btn-secondary'} btn-sm">
      📤 Devis envoyés
      ${rappels>0?`<span style="background:var(--red);color:white;border-radius:10px;font-size:9px;font-weight:700;padding:1px 6px;margin-left:4px">${rappels} rappel${rappels>1?'s':''}</span>`:''}
    </button>
  </div>`;
  if(tab==='envoyes') return renderDevisEnvoyes(tabBar);

  const opts=state.devisOptions||{};
  const htPrest=items.reduce((s,i)=>s+(i.surface*(i.prixUnit||7)),0);
  const htOpts=Object.entries(opts).reduce((s,[t,surf])=>s+(surf*(PRIX_OPTIONS[t]||0)),0);
  const ht=htPrest+htOpts;
  const tva=ht*0.081;const ttc=ht+tva;

  const defSurf=items[0]?.surface||0;
  return `
  <div class="page-header"><div><div class="page-title">Devis</div></div></div>
  ${tabBar}

      <div class="fg"><label>Date</label><input type="date" id="dv-date" value="${new Date().toISOString().split('T')[0]}"></div>
      <div class="fg"><label>📱 Numéro WhatsApp</label><input id="dv-tel" value="${state.devisTel||''}" placeholder="079 123 45 67" oninput="state.devisTel=this.value" type="tel"></div>
      <div class="fg"><label>Email client</label><input id="dv-email" value="${state.devisEmail||''}" placeholder="email@client.ch" oninput="state.devisEmail=this.value" type="email"></div>
      <div class="fg full"><label>Notes</label><textarea id="dv-note" placeholder="Remarques...">${state.devisNote}</textarea></div>
      <div class="fg full">
        <label>📅 Dates d'intervention proposées</label>
        <div id="dates-prop">
          ${(state.devisDates.length?state.devisDates:['','']).map((d,i)=>`
            <div class="date-prop-row">
              <span class="date-prop-badge">Option ${i+1}</span>
              <input type="date" value="${d}" onchange="updateDevisDate(${i},this.value)" style="font-size:13px">
              ${state.devisDates.length>2?`<button onclick="removeDevisDate(${i})" class="btn-ghost" style="color:var(--gray2);font-size:13px;border:1px solid var(--border);border-radius:6px;padding:4px 8px">✕</button>`:''}
            </div>`).join('')}
        </div>
        <button class="btn btn-secondary btn-sm" style="margin-top:4px" onclick="addDevisDate()">+ Ajouter une option</button>
      </div>
    </div></div>
    <div>
      <div class="card" style="margin-bottom:14px"><div class="section-title">Prestations de nettoyage</div>
      <div style="display:grid;grid-template-columns:2fr 90px 90px 34px;gap:8px;margin-bottom:8px">

      ${items.map((item,i)=>`<div class="devis-line"><select onchange="updateDevisItem(${i},'type',this.value)" style="font-size:12px">${Object.keys(PRIX).map(t=>`<option ${item.type===t?'selected':''}>${t}</option>`).join('')}</select><input type="number" value="${item.surface||''}" placeholder="m²" onchange="updateDevisItem(${i},'surface',this.value)" style="font-size:12px"><input type="number" value="${item.prixUnit}" onchange="updateDevisItem(${i},'prixUnit',this.value)" style="font-size:12px">${items.length>1?`<button onclick="removeDevisItem(${i})" class="btn-ghost" title="Supprimer" style="color:var(--gray2);font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--gray2)'">🗑</button>`:'<div style="width:34px"></div>'}</div><div style="font-size:11px;color:var(--gray);text-align:right;margin-bottom:10px">→ CHF ${((item.surface||0)*(item.prixUnit||7)).toFixed(2)}</div>`).join('')}

            <div style="font-size:12px;font-weight:600;color:${checked?'var(--navy)':'var(--gray2)'}">

        ${htOpts>0?`<div style="font-size:12px;color:var(--gray);text-align:right;margin-top:4px">Sous-total services : CHF ${htOpts.toFixed(2)}</div>`:''}

          <div style="display:flex;justify-content:space-between;margin-bottom:10px"><span style="color:var(--gray2);font-size:12px">TVA 8.1%</span><span style="font-weight:600;font-size:13px">CHF ${tva.toFixed(2)}</span></div>

        </div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-green" style="flex:1" onclick="downloadPDF()">⬇️ PDF</button>

          <button class="btn btn-sm" style="background:#25D366;color:white;font-weight:700" onclick="sendWhatsApp()">

            WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

// ── DEVIS ENVOYÉS ──────────────────────────────────────────────────────────
function renderDevisEnvoyes(tabBar){
  const now=new Date();
  const statColors={
    'envoyé':['#E0F2FE','#0284C7','📤'],
    'en attente':['#FEF3C7','#D97706','⏳'],
    'accepté':['#D1FAE5','#059669','✅'],
    'refusé':['#FEE2E2','#DC2626','❌'],
  };
  const sorted=[...state.devisLog].sort((a,b)=>new Date(b.dateEnvoi)-new Date(a.dateEnvoi));
  return `
  <div class="page-header">
    <div><div class="page-title">Devis</div><div class="page-sub">${state.devisLog.length} devis au total</div></div>
  </div>
  ${tabBar}
  <div style="display:flex;flex-direction:column;gap:12px">
    ${sorted.length===0?`<div class="card" style="text-align:center;padding:30px;color:var(--gray)">Aucun devis envoyé. Créez-en un dans l'onglet "Nouveau devis".</div>`:
    sorted.map(d=>{
      const jours=Math.floor((now-new Date(d.dateEnvoi))/864e5);
      const [bg,fg,ico]=statColors[d.statut]||['#F1F5F9','#64748B','📄'];
      const isRappel=(d.statut==='envoyé'||d.statut==='en attente')&&jours>=7;
      return`<div class="card" style="padding:18px${isRappel?';border-left:3px solid var(--red)':''}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">

function updateDevisStatut(id,statut){
  const d=state.devisLog.find(x=>x.id===id);
  if(d){d.statut=statut;saveStorage('devisLog');render();}
}
function deleteDevis(id){
  if(!confirm('Supprimer ce devis du journal ?'))return;
  state.devisLog=state.devisLog.filter(x=>x.id!==id);
  saveStorage('devisLog');render();
}

function confirmerChantierDevis(devisId){
  const d=state.devisLog.find(x=>x.id===devisId);
  const date=document.getElementById('cc-date').value;
  const notes=document.getElementById('cc-notes').value;
  const emps=[...document.querySelectorAll('#modalContent input[type=checkbox]:checked')].map(cb=>parseInt(cb.value));
  if(!date)return alert('Veuillez choisir une date.');
  const newChan={
    id:state.nextChantierId++,
    client:d.client,ville:d.ville,
    type:d.items[0]?.type||'Terrasse & allée',
    surface:d.items.reduce((s,i)=>s+i.surface,0),
    montant:d.ht,statut:'Planifié',date,notes,employes:emps,
  };
  state.chantiers.push(newChan);
  d.chantierId=newChan.id;
  // Jump calendar to that month
  const dt=new Date(date);state.calYear=dt.getFullYear();state.calMonth=dt.getMonth();
  saveStorage('chantiers');saveStorage('devisLog');closeModal();
  // Navigate to calendar to see it
  navigate('calendrier');
}

function rappelWhatsApp(id){
  const d=state.devisLog.find(x=>x.id===id);
  if(!d.tel){alert('Aucun numéro de téléphone enregistré pour ce devis.');return;}
  let num=d.tel.replace(/\s/g,'').replace(/[^0-9+]/g,'');
  if(num.startsWith('0'))num='41'+num.slice(1);
  if(num.startsWith('+'))num=num.slice(1);
  const msg=`Bonjour ${d.client.split(' ')[0]} 👋\n\nNous revenons vers vous concernant notre devis *${d.num}* envoyé il y a quelques jours (CHF ${d.ttc.toFixed(0)} TTC).\n\nAvez-vous eu le temps d'en prendre connaissance ? N'hésitez pas à nous poser vos questions.\n\n_Bowen HydroClean — www.bowenhydroclean.ch_`;
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
}

function rappelEmail(id){
  const d=state.devisLog.find(x=>x.id===id);
  const sujet=`Rappel : votre devis ${d.num} — Bowen HydroClean`;
  const corps=`Bonjour ${d.client.split(' ')[0]},\n\nNous revenons vers vous concernant notre devis ${d.num} du ${new Date(d.dateEnvoi).toLocaleDateString('fr-CH')} pour CHF ${d.ttc.toFixed(2)} TTC.\n\nAvez-vous eu l'occasion d'en prendre connaissance ? Nous restons disponibles pour toute question ou ajustement.\n\nCordialement,\nL'équipe Bowen HydroClean\nwww.bowenhydroclean.ch`;
  try{window.location.href='mailto:'+(d.email||'')+'?subject='+encodeURIComponent(sujet)+'&body='+encodeURIComponent(corps);}catch(_e){showToast('Ouvrez votre application email');}
}

function saveDevisToLog(client,ville,tel,email,items,ht,ttc){
  const num='BHC-'+new Date().getFullYear()+'-'+String(state.nextDevisId).padStart(3,'0');
  state.devisLog.push({
    id:state.nextDevisId++,num,client,ville,tel,email,
    dateEnvoi:new Date().toISOString().split('T')[0],
    statut:'envoyé',items:items.map(i=>({type:i.type,surface:i.surface,prixUnit:i.prixUnit})),
    ht,ttc,chantierId:null,
  });
  saveStorage('devisLog');
}
function updateDevisItem(i,field,val){
  if(field==='type'){state.devisItems[i].type=val;state.devisItems[i].prixUnit=PRIX[val]||7;}
  else if(field==='surface')state.devisItems[i].surface=parseFloat(val)||0;
  else if(field==='prixUnit')state.devisItems[i].prixUnit=parseFloat(val)||0;
  render();
}
function addDevisItem(){state.devisItems.push({id:Date.now(),type:'Terrasse & allée',surface:0,prixUnit:7});render();}
function removeDevisItem(i){if(state.devisItems.length>1)state.devisItems.splice(i,1);render();}

function toggleDevisOption(type,checked,defSurf){
  if(!state.devisOptions)state.devisOptions={};
  if(checked){state.devisOptions[type]=defSurf||0;}
  else{delete state.devisOptions[type];}
  render();
}
function updateDevisOption(type,val){
  if(!state.devisOptions)state.devisOptions={};
  state.devisOptions[type]=parseFloat(val)||0;
  render();
}

function updateDevisDate(i,val){
  if(!state.devisDates[i]&&state.devisDates.length<=i)state.devisDates.push(val);
  else state.devisDates[i]=val;
}
function addDevisDate(){
  if(state.devisDates.length<4){state.devisDates.push('');render();}
}
function removeDevisDate(i){
  state.devisDates.splice(i,1);render();
}
function getDatesText(prefix){
  // Read live from DOM first (user may not have triggered onchange)
  document.querySelectorAll('#dates-prop input[type=date]').forEach((el,i)=>{
    if(el.value) state.devisDates[i]=el.value;
  });
  const valid=state.devisDates.filter(d=>d);
  if(!valid.length)return '';
  return prefix+valid.map((d,i)=>{
    const dt=new Date(d);
    const label=dt.toLocaleDateString('fr-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    return`Option ${i+1} : ${label}`;
  }).join('\n');
}

// ─── SWISS QR BILL ───────────────────────────────────────────────────────────
function buildSwissQRData(f){
  const s=state.settings;
  const iban=(s.iban||'').replace(/\s/g,'');
  // Parse debtor address from facture
  const client=state.clients.find(x=>x.nom===f.client)||{};
  const debtorAddr=client.adresse||'';
  const debtorNpa=client.ville||'';
  const amount=f.ttc.toFixed(2);
  const ref=f.num||'';
  const msg='Facture '+ref;
  // Swiss QR Bill format — 31 fields separated by \r\n
  const fields=[
    'SPC',          // Header
    '0200',         // Version
    '1',            // Coding
    iban,           // IBAN
    'K',            // Creditor address type (K = combined)
    s.titulaire||'',// Creditor name
    s.adresse||'',  // Creditor address line 1
    s.npa||'',      // Creditor address line 2 (NPA + city)
    '',             // empty
    '',             // empty
    'CH',           // Creditor country
    '',             // Ultimate creditor type
    '',             // UC name
    '',             // UC address 1
    '',             // UC address 2
    '',             // UC address 3
    '',             // UC address 4
    '',             // UC country
    amount,         // Amount
    'CHF',          // Currency
    client.nom?'K':'',// Debtor address type
    client.nom||'', // Debtor name
    debtorAddr,     // Debtor address 1
    debtorNpa,      // Debtor address 2 (NPA + city)
    '',             // Debtor address 3
    '',             // Debtor address 4
    client.nom?'CH':'',// Debtor country
    'NON',          // Reference type (NON = no reference)
    '',             // Reference
    msg,            // Additional info
    'EPD',          // End of Payment Data
  ];
  return fields.join('\r\n');
}

function getQRDataUrl(f){
  return new Promise(resolve=>{
    const tmp=document.createElement('div');
    tmp.style.cssText='position:fixed;left:-9999px;top:-9999px;width:200px;height:200px';
    document.body.appendChild(tmp);
    try{
      new QRCode(tmp,{
        text:buildSwissQRData(f),width:200,height:200,
        colorDark:'#0B1F3A',colorLight:'#ffffff',
        correctLevel:QRCode.CorrectLevel.M,
      });
      setTimeout(()=>{
        const canvas=tmp.querySelector('canvas');
        const url=canvas?canvas.toDataURL('image/png'):null;
        document.body.removeChild(tmp);
        resolve(url);
      },150);
    }catch(e){
      document.body.removeChild(tmp);
      resolve(null);
    }
  });
}

  const f=state.factures.find(x=>x.id===id);
  if(!f){alert('Facture introuvable');return;}
  try{
    getQRDataUrl(f).then(qrUrl=>{
      try{
        buildInvoicePDF(id,qrUrl);
      }catch(e){
        console.error('buildInvoicePDF error:',e);
        alert('Erreur PDF: '+e.message+'\n\nVérifiez la console pour plus de détails.');
      }
    }).catch(e=>{
      console.error('QR error:',e);
      // Try without QR
      try{buildInvoicePDF(id,null);}catch(e2){alert('Erreur PDF: '+e2.message);}
    });
  }catch(e){
    console.error('downloadInvoicePDF error:',e);
    alert('Erreur: '+e.message);
  }
}

function buildInvoicePDF(id,qrUrl){
  const {jsPDF}=window.jspdf;

  const s=state.settings;
  const client=state.clients.find(x=>x.nom===f.client)||{};
  const chan=state.chantiers.find(x=>x.id===f.chantierId)||{};
  // Defensive fallbacks for missing fields
  const montantHT=f.montantHT||f.montant||0;
  const ttc=f.ttc||(montantHT*1.081)||0;
  const fType=f.type||chan.type||'Nettoyage haute pression';
  const fSurface=f.surface||chan.surface||0;
  const fAdresse=f.adresse||chan.adresse||client.adresse||'';
  const fVille=f.ville||chan.ville||client.ville||'';
  const fDateEcheance=f.dateEcheance||f.dateFacture||new Date().toISOString().split('T')[0];
  // Employees who worked on this chantier
  const empList=(chan.employes||[]).map(eid=>state.employes.find(e=>e.id===eid)).filter(Boolean);
  // Hours logged for this chantier
  const hChan=state.heures.filter(h=>h.chantierId===f.chantierId);
  const totalH=hChan.length>0?hChan.reduce((s,h)=>s+h.heures,0):estimerDureeH(fType,fSurface);
  const dureeStr=totalH<1?Math.round(totalH*60)+' min':(Math.floor(totalH)+'h'+(totalH%1?'30':''));

  // ── HEADER ─────────────────────────────────────────────────────────
  doc.setFillColor(11,31,58);doc.rect(0,0,210,52,'F');
  doc.setFillColor(14,165,233);doc.rect(0,0,4,52,'F');
  // Logo image
  try{ doc.addImage(LOGO_PDF,'JPEG',10,6,60,30); }
  catch(e){
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(18);
    doc.text('Bowen HydroClean',14,22);
  }
  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(148,163,184);
  doc.text((s.adresse||'')+(s.npa?' \u00b7 '+s.npa:''),14,42);
  doc.text('www.bowenhydroclean.ch \u00b7 '+(s.tva||''),14,48);
  // FACTURE badge - taille adaptée au numéro
  doc.setFillColor(14,165,233);doc.roundedRect(130,8,66,26,3,3,'F');
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);

  doc.setTextColor(220,240,255);doc.setFont('helvetica','bold');doc.setFontSize(9);

// Helper for estimated hours as number
function estimerDureeH(type,surface){
  const v=VITESSE_M2H[type]||10;
  return Math.ceil((surface/v)*2)/2;
}

function exportData(){
  const backup={
    version:2,date:new Date().toISOString(),
    clients:state.clients,chantiers:state.chantiers,
    monthly:state.monthly,employes:state.employes,
    heures:state.heures,devisLog:state.devisLog,
    factures:state.factures,settings:state.settings,
    campagnes:state.campagnes,
    nextClientId:state.nextClientId,nextChantierId:state.nextChantierId,
    nextEmployeId:state.nextEmployeId,nextHeureId:state.nextHeureId,
    nextDevisId:state.nextDevisId,nextFactureId:state.nextFactureId,
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toLocaleDateString('fr-CH').replace(/\./g,'-');
  a.href=url;a.download=`BHC-backup-${date}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast('💾 Sauvegarde exportée — '+date);
}

function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.clients||!data.chantiers)throw new Error('Format invalide');
      if(!confirm(`Restaurer la sauvegarde du ${new Date(data.date).toLocaleDateString('fr-CH')} ?\n\nToutes vos données actuelles seront remplacées.`))return;
      // Restore state
      state.clients=data.clients||state.clients;
      state.chantiers=data.chantiers||state.chantiers;
      state.monthly=data.monthly||state.monthly;
      state.employes=data.employes||state.employes;
      state.heures=data.heures||state.heures;
      state.devisLog=data.devisLog||state.devisLog;
      state.factures=data.factures||state.factures;
      state.settings=data.settings||state.settings;
      state.nextClientId=data.nextClientId||state.nextClientId;
      state.nextChantierId=data.nextChantierId||state.nextChantierId;
      state.nextEmployeId=data.nextEmployeId||state.nextEmployeId;
      state.nextHeureId=data.nextHeureId||state.nextHeureId;
      state.nextDevisId=data.nextDevisId||state.nextDevisId;
      state.nextFactureId=data.nextFactureId||state.nextFactureId;
      // Save all to localStorage
      ['clients','chantiers','monthly','employes','heures','devisLog','factures','settings'].forEach(k=>saveStorage(k));
      render();
      showToast('✅ Données restaurées avec succès !');
    }catch(err){
      alert('Erreur lors de l\'import : '+err.message+'\n\nVérifiez que le fichier est une sauvegarde BHC valide.');
    }
  };
  reader.readAsText(file);
  input.value=''; // Reset input
}
